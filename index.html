<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Tasbih</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="title" content="Digital Tasbih">
    <meta name="description" content="Offline Digital Tasbih and Dhikr Counter PWA">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tasbih">
    
    <!-- Manifest & Icons -->
    <link rel="manifest" id="manifest-placeholder">
    <link rel="apple-touch-icon" id="apple-touch-icon">
    <link rel="icon" type="image/svg+xml" id="favicon">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Disable touch callouts, blue highlight, and text selection globally */
        * {
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none;
            user-select: none;
        }

        /* Pulse Animation for Ring */
        @keyframes ringPulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.8)); }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .pulse-active {
            animation: ringPulse 0.8s ease-in-out infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-300 select-none overflow-x-hidden">

    <!-- App Header -->
    <header class="w-full max-w-md mx-auto p-4 flex justify-between items-center z-10">
        <div class="flex items-center gap-2">
            <!-- Updated Logo SVG: Tassel placed underneath the beads -->
            <svg class="w-8 h-8 text-indigo-600 dark:text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Bead Ring -->
                <circle cx="12" cy="9" r="6" stroke-dasharray="2 2" />
                <!-- Main Hanging Bead -->
                <circle cx="12" cy="15" r="1.5" fill="currentColor" />
                <!-- Tassel Hanging Underneath -->
                <path d="M12 16.5 V21" />
                <path d="M10 21 L14 21" />
                <path d="M10.5 19.5 L13.5 19.5" />
            </svg>
            <h1 class="text-xl font-bold tracking-wide">Tasbih</h1>
        </div>
        <div class="flex items-center gap-2">
            <button id="btn-history" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                <i data-lucide="history" class="w-6 h-6"></i>
            </button>
            <button id="btn-settings" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                <i data-lucide="settings" class="w-6 h-6"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-md w-full mx-auto flex flex-col justify-between items-center px-4 pb-6">
        
        <!-- Top Stats / Target Indicator -->
        <div class="w-full flex justify-between items-center bg-white dark:bg-slate-800 px-4 py-3 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/50 mt-2">
            <div class="flex flex-col">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Target</span>
                <span id="display-target" class="text-lg font-bold text-indigo-600 dark:text-indigo-400">33</span>
            </div>
            <div class="flex flex-col items-center">

        </div>

        <!-- Counter Center Display & Clicker Zone -->

                    <!-- Track Circle -->

                </svg>

                <!-- Interactive Main Tap Button -->
                <button id="btn-count" class="absolute inset-4 rounded-full bg-white dark:bg-slate-800 shadow-xl border border-slate-100 dark:border-slate-700 flex flex-col items-center justify-center active:scale-95 transition-transform duration-100 focus:outline-none cursor-pointer">

                        <i data-lucide="eye-off" class="w-5 h-5"></i>
                        <span>Enter Privacy Mode</span>

        </div>
    </div>

    <!-- DHIKR PRESETS MODAL -->
    <div id="modal-dhikr" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl border border-slate-100 dark:border-slate-700 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold flex items-center gap-2">

            <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-700 flex gap-2">
                <button id="btn-manual-log" class="flex-1 py-2 px-4 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 rounded-xl text-sm font-semibold hover:bg-indigo-100 dark:hover:bg-indigo-900/50 transition flex items-center justify-center gap-1">

    <!-- MANUAL ENTRY MODAL -->
    <div id="modal-manual-log" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl w-full max-w-sm p-6 shadow-2xl border border-slate-100 dark:border-slate-700">
            <h3 class="text-lg font-bold mb-4">Log Manual Dhikr</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Dhikr Name</label>
                    <input type="text" id="manual-name" class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" value="Custom Dhikr">

                </div>
            </div>

    <!-- Application Script -->
    <script>
        // Inline Manifest Generation for Offline PWA Support
        const manifestData = {
            name: "Digital Tasbih & Dhikr Counter",
            short_name: "Tasbih",
            description: "Offline Digital Tasbih PWA App",
            start_url: "./",
            display: "standalone",
            background_color: "#0f172a",
            theme_color: "#4f46e5",
            icons: [
                {
                    src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><circle cx='50' cy='40' r='25' stroke='%23ffffff' stroke-width='6' fill='none' stroke-dasharray='8 8'/><circle cx='50' cy='65' r='6' fill='%23ffffff'/><path d='M50 71 L50 90 M42 90 L58 90 M44 84 L56 84' stroke='%23ffffff' stroke-width='5' stroke-linecap='round'/></svg>",
                    sizes: "512x512",
                    type: "image/svg+xml",
                    purpose: "any maskable"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
        document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));
        document.getElementById('favicon').setAttribute('href', manifestData.icons[0].src);
        document.getElementById('apple-touch-icon').setAttribute('href', manifestData.icons[0].src);

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'tasbih-v2';
                    const ASSETS = ['./'];
                    self.addEventListener('install', (e) => {
                        e.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS)));
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            });
        }

        // Preset Dhikr Data
        const DHIKR_PRESETS = [
            { name: "SubhanAllah", arabic: "سُبْحَانَ ٱللَّٰهِ", translation: "Glory be to Allah" },
            { name: "Alhamdulillah", arabic: "ٱلْحَمْدُ لِلَّٰهِ", translation: "Praise be to Allah" },
            { name: "Allahu Akbar", arabic: "ٱللَّٰهُ أَكْبَرُ", translation: "Allah is the Greatest" },
            { name: "La ilaha illallah", arabic: "لَا إِلَٰهَ إِلَّا ٱللَّٰهُ", translation: "There is no god but Allah" },
            { name: "Astaghfirullah", arabic: "أَسْتَغْفِرُ ٱللَّٰهَ", translation: "I seek forgiveness from Allah" },
            { name: "La hawla wa la quwwata illa billah", arabic: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِٱللَّٰهِ", translation: "There is no power except with Allah" },
            { name: "SubhanAllahi wa bihamdihi", arabic: "سُبْحَانَ ٱللَّٰهِ وَبِحَمْدِهِ", translation: "Glory and praise be to Allah" },
            { name: "Salawat", arabic: "اللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ", translation: "Blessings upon Muhammad" }
        ];

        // Web Audio API Synthesizer (Zero External Dependencies)
        class AudioFeedback {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playClick() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.04);
            }
            playCompletion() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    const startTime = this.ctx.currentTime + (index * 0.08);
                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.3);
                });
            }
        }

        // App State Manager
        const state = {
            count: 0,
            target: 33,
            laps: 0,
            total: 0,
            dhikr: DHIKR_PRESETS[0],
            soundEnabled: true,
            vibrateEnabled: false,
            pulseEnabled: true,
            darkMode: false,
            history: JSON.parse(localStorage.getItem('tasbih_history') || '[]')
        };

        const audio = new AudioFeedback();

        // DOM Elements
        const elDisplayCount = document.getElementById('display-count');
        const elDisplayTarget = document.getElementById('display-target');
        const elDisplayLaps = document.getElementById('display-laps');
        const elDisplayTotal = document.getElementById('display-total');
        const elDhikrLabel = document.getElementById('dhikr-label');
        const elProgressBar = document.getElementById('progress-bar');
        const elCounterRingContainer = document.getElementById('counter-ring-container');

        const btnCount = document.getElementById('btn-count');
        const btnReset = document.getElementById('btn-reset');
        const btnSound = document.getElementById('btn-sound');
        const iconSound = document.getElementById('icon-sound');
        const labelSound = document.getElementById('label-sound');
        const btnDhikrSelect = document.getElementById('btn-dhikr-select');
        const btnSettings = document.getElementById('btn-settings');
        const btnHistory = document.getElementById('btn-history');

        // Modals & Overlays
        const modalSettings = document.getElementById('modal-settings');
        const closeSettings = document.getElementById('close-settings');
        const modalDhikr = document.getElementById('modal-dhikr');
        const closeDhikr = document.getElementById('close-dhikr');
        const modalHistory = document.getElementById('modal-history');
        const closeHistory = document.getElementById('close-history');
        const modalManualLog = document.getElementById('modal-manual-log');

        const privacyOverlay = document.getElementById('privacy-overlay');
        const btnActivatePrivacy = document.getElementById('btn-activate-privacy');
        const btnExitPrivacy = document.getElementById('btn-exit-privacy');
        const privacyTapArea = document.getElementById('privacy-tap-area');

        const inputTarget = document.getElementById('input-target');
        const toggleVibrate = document.getElementById('toggle-vibrate');
        const togglePulse = document.getElementById('toggle-pulse');
        const toggleTheme = document.getElementById('toggle-theme');

        // Initialize App
        function init() {
            lucide.createIcons();
            loadSettings();
            renderDhikrList();
            updateUI();
        }

        function loadSettings() {
            const saved = localStorage.getItem('tasbih_settings');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.target = parsed.target || 33;
                state.soundEnabled = parsed.soundEnabled ?? true;
                state.vibrateEnabled = parsed.vibrateEnabled ?? false;
                state.pulseEnabled = parsed.pulseEnabled ?? true;
                state.darkMode = parsed.darkMode ?? false;
            }
            if (state.darkMode || window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
                toggleTheme.checked = true;
                state.darkMode = true;
            }
            toggleVibrate.checked = state.vibrateEnabled;
            togglePulse.checked = state.pulseEnabled;
            inputTarget.value = state.target;
            updateSoundIcon();
        }

        function saveSettings() {
            localStorage.setItem('tasbih_settings', JSON.stringify({
                target: state.target,
                soundEnabled: state.soundEnabled,
                vibrateEnabled: state.vibrateEnabled,
                pulseEnabled: state.pulseEnabled,
                darkMode: state.darkMode
            }));
        }

        function updateUI() {
            elDisplayCount.textContent = state.count;
            elDisplayTarget.textContent = state.target;
            elDisplayLaps.textContent = state.laps;
            elDisplayTotal.textContent = state.total;
            elDhikrLabel.textContent = state.dhikr.name;

            // Progress Ring Calculation (276.46 circumference)
            const circumference = 2 * Math.PI * 44;
            const progress = Math.min(state.count / state.target, 1);
            const offset = circumference - (progress * circumference);
            elProgressBar.style.strokeDashoffset = offset;

            // Visual Ring Pulse Check
            if (state.count >= state.target && state.pulseEnabled) {
                elCounterRingContainer.classList.add('pulse-active');
            } else {
                elCounterRingContainer.classList.remove('pulse-active');
            }
        }

        // Increment Action Core Logic
        function increment() {
            state.count++;
            state.total++;

            if (state.soundEnabled) audio.playClick();
            if (state.vibrateEnabled && navigator.vibrate) navigator.vibrate(40);

            if (state.count >= state.target) {
                state.laps++;
                if (state.soundEnabled) audio.playCompletion();
                if (state.vibrateEnabled && navigator.vibrate) navigator.vibrate([60, 100, 60]);
                logHistory(state.dhikr.name, state.target);
            }

            updateUI();
        }

        function updateSoundIcon() {
            if (state.soundEnabled) {
                iconSound.setAttribute('data-lucide', 'volume-2');
                labelSound.textContent = 'Sound On';
            } else {
                iconSound.setAttribute('data-lucide', 'volume-x');
                labelSound.textContent = 'Mute';
            }
            lucide.createIcons();
        }

        // Tap Handlers
        btnCount.addEventListener('click', () => {
            if (state.count >= state.target) {
                state.count = 0; // Auto reset loop on next tap after reaching goal
            }
            increment();
        });

        // Privacy Mode Taps
        privacyTapArea.addEventListener('click', () => {
            if (state.count >= state.target) state.count = 0;
            increment();
        });

        btnActivatePrivacy.addEventListener('click', () => {
            modalSettings.classList.add('hidden');
            privacyOverlay.classList.remove('hidden');
            privacyOverlay.classList.add('flex');
        });

        btnExitPrivacy.addEventListener('click', (e) => {
            e.stopPropagation();
            privacyOverlay.classList.add('hidden');
            privacyOverlay.classList.remove('flex');
        });

        // Controls Handlers
        btnReset.addEventListener('click', () => {
            if (state.count > 0 && state.count < state.target) {
                logHistory(state.dhikr.name + " (Partial)", state.count);
            }
            state.count = 0;
            state.laps = 0;
            updateUI();
        });

        btnSound.addEventListener('click', () => {
            state.soundEnabled = !state.soundEnabled;
            updateSoundIcon();
            saveSettings();
        });

        // Dhikr List Management
        function renderDhikrList() {
            const container = document.getElementById('dhikr-list');
            container.innerHTML = DHIKR_PRESETS.map((item, idx) => `
                <button class="w-full text-left p-3 rounded-xl border border-slate-100 dark:border-slate-700 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition flex justify-between items-center group ${state.dhikr.name === item.name ? 'bg-indigo-50/70 dark:bg-indigo-900/40 border-indigo-300 dark:border-indigo-600' : ''}" data-idx="${idx}">
                    <div>
                        <div class="font-bold text-slate-800 dark:text-slate-100">${item.name}</div>
                        <div class="text-xs text-slate-400">${item.translation}</div>
                    </div>
                    <div class="text-right">
                        <div class="font-serif text-lg text-indigo-600 dark:text-indigo-400">${item.arabic}</div>
                    </div>
                </button>
            `).join('');

            container.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = btn.getAttribute('data-idx');
                    state.dhikr = DHIKR_PRESETS[idx];
                    state.count = 0;
                    updateUI();
                    modalDhikr.classList.add('hidden');
                });
            });
        }

        // History System
        function logHistory(name, count) {
            if (count <= 0) return;
            const entry = {
                id: Date.now(),
                name: name,
                count: count,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                date: new Date().toLocaleDateString()
            };
            state.history.unshift(entry);
            localStorage.setItem('tasbih_history', JSON.stringify(state.history));
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            if (state.history.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">No history entries logged yet.</div>`;
                return;
            }
            container.innerHTML = state.history.map(item => `
                <div class="flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-900/60 rounded-xl border border-slate-100 dark:border-slate-700/50">
                    <div>
                        <div class="font-semibold text-sm text-slate-800 dark:text-slate-200">${item.name}</div>
                        <div class="text-xs text-slate-400">${item.date} • ${item.timestamp}</div>
                    </div>
                    <div class="font-bold text-indigo-600 dark:text-indigo-400 text-lg">
                        +${item.count}
                    </div>
                </div>
            `).join('');
        }

        // Modal Triggers
        btnSettings.addEventListener('click', () => modalSettings.classList.remove('hidden'));
        closeSettings.addEventListener('click', () => modalSettings.classList.add('hidden'));

        btnDhikrSelect.addEventListener('click', () => {
            renderDhikrList();
            modalDhikr.classList.remove('hidden');
        });
        closeDhikr.addEventListener('click', () => modalDhikr.classList.add('hidden'));

        btnHistory.addEventListener('click', () => {
            renderHistory();
            modalHistory.classList.remove('hidden');
        });
        closeHistory.addEventListener('click', () => modalHistory.classList.add('hidden'));

        document.getElementById('btn-clear-history').addEventListener('click', () => {
            state.history = [];
            localStorage.removeItem('tasbih_history');
            renderHistory();
        });

        // Settings Inputs
        document.querySelectorAll('.target-preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const target = parseInt(btn.getAttribute('data-target'));
                state.target = target;
                inputTarget.value = target;
                saveSettings();
                updateUI();
            });
        });

        inputTarget.addEventListener('change', (e) => {
            const val = parseInt(e.target.value);
            if (val > 0) {
                state.target = val;
                saveSettings();
                updateUI();
            }
        });

        toggleVibrate.addEventListener('change', (e) => {
            state.vibrateEnabled = e.target.checked;
            saveSettings();
        });

        togglePulse.addEventListener('change', (e) => {
            state.pulseEnabled = e.target.checked;
            saveSettings();
            updateUI();
        });

        toggleTheme.addEventListener('change', (e) => {
            state.darkMode = e.target.checked;
            if (state.darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            saveSettings();
        });

        // Manual History Entry Modal Setup
        const btnManualLog = document.getElementById('btn-manual-log');
        const btnSaveManual = document.getElementById('btn-save-manual');
        const btnCancelManual = document.getElementById('btn-cancel-manual');

        btnManualLog.addEventListener('click', () => modalManualLog.classList.remove('hidden'));
        btnCancelManual.addEventListener('click', () => modalManualLog.classList.add('hidden'));
        btnSaveManual.addEventListener('click', () => {
            const name = document.getElementById('manual-name').value || 'Custom Dhikr';
            const count = parseInt(document.getElementById('manual-count').value) || 0;
            if (count > 0) {
                logHistory(name, count);
                renderHistory();
                modalManualLog.classList.add('hidden');
                document.getElementById('manual-count').value = '';
            }
        });

        // Startup Call
        init();
    </script>
</body>
</html>
