<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasbih PWA</title>
  <meta name="theme-color" content="#000000">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --accent-color: #10b981;
      --accent-glow: #34d399;
      --text-main: #ffffff;
      --text-muted: #a3a3a3;
      --border-color: #262626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* App Header */
    header {
      width: 100%;
      max-width: 480px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand svg {
      width: 36px;
      height: 36px;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Navigation Tabs */
    nav {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.875rem;
      cursor: pointer;
    }

    .nav-btn.active {
      background: var(--accent-color);
      color: #000000;
      border-color: var(--accent-color);
      font-weight: 600;
    }

    /* Main Container */
    main {
      width: 100%;
      max-width: 480px;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .view {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .view.active {
      display: flex;
    }

    /* Home View Elements */
    .lifetime-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
    }

    .lifetime-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .lifetime-value {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--accent-glow);
      margin-top: 4px;
    }

    .dhikr-selector {
      width: 100%;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 12px;
      font-size: 1rem;
      margin-bottom: 24px;
      outline: none;
    }

    /* Count Area */
    .counter-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .count-button {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, #064e3b 0%, #000000 100%);
      border: 4px solid var(--accent-color);
      color: var(--text-main);
      font-size: 3.5rem;
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
      transition: transform 0.05s ease;
      outline: none;
    }

    .count-button:active {
      transform: scale(0.95);
    }

    /* History View Elements */
    .history-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .date-picker {
      width: 100%;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 12px;
      font-size: 1rem;
      color-scheme: dark;
    }

    .daily-summary-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }

    .daily-summary-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .daily-summary-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-color);
      margin-top: 4px;
    }

    .breakdown-title {
      font-size: 1rem;
      margin: 20px 0 12px 0;
      color: var(--text-muted);
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dhikr-name {
      font-weight: 500;
    }

    .dhikr-count {
      font-weight: 700;
      color: var(--accent-glow);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 30px 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <rect width="512" height="512" rx="110" fill="#050d0a"/>
        <circle cx="256" cy="300" r="100" fill="none" stroke="#064e3b" stroke-width="12" stroke-dasharray="1 28" stroke-linecap="round"/>
        <circle cx="256" cy="400" r="22" fill="#059669"/>
        <path d="M 256 378 L 256 190" stroke="#10b981" stroke-width="16" stroke-linecap="round"/>
        <path d="M 256 220 C 190 200, 170 130, 256 110 C 342 130, 322 200, 256 220 Z" fill="#34d399"/>
        <path d="M 256 220 C 256 170, 256 130, 256 110" stroke="#059669" stroke-width="6" fill="none"/>
      </svg>
      <h1>Tasbih</h1>
    </div>
    <nav>
      <button class="nav-btn active" id="tab-home">Counter</button>
      <button class="nav-btn" id="tab-history">History</button>
    </nav>
  </header>

  <main>
    <!-- HOME / COUNTER VIEW -->
    <section id="view-home" class="view active">
      <div class="lifetime-card">
        <div class="lifetime-label">Lifetime Dhikr Count</div>
        <div id="lifetime-total-display" class="lifetime-value">0</div>
      </div>

      <select id="dhikr-select" class="dhikr-selector">
        <option value="subhanallah">SubhanAllah</option>
        <option value="alhamdulillah">Alhamdulillah</option>
        <option value="allahu_akbar">Allahu Akbar</option>
        <option value="astaghfirullah">Astaghfirullah</option>
      </select>

      <div class="counter-area">
        <button id="main-counter-btn" class="count-button">0</button>
      </div>
    </section>

    <!-- HISTORY LOOK-BACK VIEW -->
    <section id="view-history" class="view">
      <div class="history-header">
        <input type="date" id="history-date-picker" class="date-picker">
        
        <div class="daily-summary-card">
          <div class="daily-summary-label">Total Dhikr For Selected Day</div>
          <div id="daily-total-display" class="daily-summary-value">0</div>
        </div>
      </div>

      <h2 class="breakdown-title">Daily Breakdown</h2>
      <ul id="history-breakdown-list" class="history-list">
        <!-- Dynamic Items Render Here -->
      </ul>
    </section>
  </main>
  
  <script>
    // --- DATA & STORAGE ENGINE ---
    const STORAGE_KEY = 'tasbih_pwa_data';

    // Retrieve global data or initialize default state
    function getAppData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        return {
          history: {},      // Format: { "YYYY-MM-DD": { "subhanallah": 33, ... } }
          sessionCounts: {},// Format: { "subhanallah": 0, ... }
          lifetimeTotal: 0
        };
      }
      return JSON.parse(raw);
    }

    // Save state object back to localStorage
    function saveAppData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // Helper: Formats Date object to YYYY-MM-DD string
    function formatDateKey(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // Increment dhikr count for both daily history and global lifetime total
    function recordDhikr(dhikrId) {
      const data = getAppData();
      const today = formatDateKey(new Date());

      // Ensure today's history object exists
      if (!data.history[today]) {
        data.history[today] = {};
      }

      // Increment today's count for selected dhikr
      data.history[today][dhikrId] = (data.history[today][dhikrId] || 0) + 1;

      // Increment active session counter for selected dhikr
      if (!data.sessionCounts) data.sessionCounts = {};
      data.sessionCounts[dhikrId] = (data.sessionCounts[dhikrId] || 0) + 1;

      // Increment total count since day one
      data.lifetimeTotal = (data.lifetimeTotal || 0) + 1;

      saveAppData(data);
      return data;
    }

    // Retrieve stats breakdown for any target date string (YYYY-MM-DD)
    function getHistoryForDate(dateKey) {
      const data = getAppData();
      const dayRecord = data.history[dateKey] || {};

      // Compute total dhikrs recorded on that specific date
      const dailyTotal = Object.values(dayRecord).reduce((sum, val) => sum + val, 0);

      return {
        date: dateKey,
        dailyTotal: dailyTotal,
        breakdown: dayRecord
      };
    }

    // Get current lifetime count
    function getLifetimeTotal() {
      return getAppData().lifetimeTotal || 0;
    }

    // Get current active session count for selected dhikr
    function getSessionCount(dhikrId) {
      const data = getAppData();
      return (data.sessionCounts && data.sessionCounts[dhikrId]) || 0;
    }

  // --- UI CONTROLLER & NAVIGATION ---
    
    // DOM Elements
    const tabHome = document.getElementById('tab-home');
    const tabHistory = document.getElementById('tab-history');
    const viewHome = document.getElementById('view-home');
    const viewHistory = document.getElementById('view-history');

    const lifetimeDisplay = document.getElementById('lifetime-total-display');
    const dhikrSelect = document.getElementById('dhikr-select');
    const mainCounterBtn = document.getElementById('main-counter-btn');

    const datePicker = document.getElementById('history-date-picker');
    const dailyTotalDisplay = document.getElementById('daily-total-display');
    const historyList = document.getElementById('history-breakdown-list');

    // Initialize UI on startup
    function init() {
      // Set date picker default to today
      const todayString = formatDateKey(new Date());
      datePicker.value = todayString;

      // Update counters
      refreshHomeUI();
      refreshHistoryUI(todayString);

      // Event Listeners
      tabHome.addEventListener('click', () => switchView('home'));
      tabHistory.addEventListener('click', () => switchView('history'));

      dhikrSelect.addEventListener('change', () => {
        refreshHomeUI();
      });

      mainCounterBtn.addEventListener('click', () => {
        const selectedDhikr = dhikrSelect.value;
        recordDhikr(selectedDhikr);
        
        // Trigger subtle visual feedback/haptic
        if (navigator.vibrate) navigator.vibrate(40);
        
        refreshHomeUI();
        refreshHistoryUI(datePicker.value);
      });

      datePicker.addEventListener('change', (e) => {
        refreshHistoryUI(e.target.value);
      });
    }

    // Switch between Counter and History tabs
    function switchView(target) {
      if (target === 'home') {
        tabHome.classList.add('active');
        tabHistory.classList.remove('active');
        viewHome.classList.add('active');
        viewHistory.classList.remove('active');
        refreshHomeUI();
      } else {
        tabHistory.classList.add('active');
        tabHome.classList.remove('active');
        viewHistory.classList.add('active');
        viewHome.classList.remove('active');
        refreshHistoryUI(datePicker.value);
      }
    }

    // Update Home View numbers
    function refreshHomeUI() {
      lifetimeDisplay.textContent = getLifetimeTotal().toLocaleString();
      const currentDhikr = dhikrSelect.value;
      mainCounterBtn.textContent = getSessionCount(currentDhikr).toLocaleString();
    }

    // Render History Look-back View
    function refreshHistoryUI(dateKey) {
      if (!dateKey) return;
      
      const stats = getHistoryForDate(dateKey);
      dailyTotalDisplay.textContent = stats.dailyTotal.toLocaleString();

      historyList.innerHTML = '';
      const entries = Object.entries(stats.breakdown);

      if (entries.length === 0) {
        historyList.innerHTML = '<li class="empty-state">No dhikr recorded for this date.</li>';
        return;
      }

      entries.forEach(([id, count]) => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <span class="dhikr-name">${formatDhikrLabel(id)}</span>
          <span class="dhikr-count">${count.toLocaleString()}</span>
        `;
        historyList.appendChild(li);
      });
    }

    // Utility: Format internal keys to readable text
    function formatDhikrLabel(id) {
      return id.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    // Run on page load
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
