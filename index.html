<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline Tasbih</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <style>
    :root {
      --bg: #090d16;
      --card: #131a27;
      --border: #1e293b;
      --accent: #d97706;
      --accent-soft: #f59e0b;
      --text: #e2e8f0;
      --text-muted: #64748b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 1rem;
      gap: 1rem;
    }
    header, main, section {
      width: 100%;
      max-width: 420px;
    }
    /* Full Dates Banner */
    .full-date-card {
      background: var(--card);
      border-radius: 16px;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 0.5rem;
    }
    .gregorian-text {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .hijri-text {
      font-size: 1rem;
      color: var(--accent-soft);
      font-weight: 600;
    }
    select, input[type="date"] {
      width: 100%;
      padding: 0.75rem;
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 0.95rem;
      outline: none;
    }
    .main-card {
      background: var(--card);
      border-radius: 24px;
      padding: 1.5rem 1rem;
      text-align: center;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .counter-display {
      font-size: 4.25rem;
      font-weight: 700;
      color: var(--accent-soft);
      line-height: 1;
      margin: 0.5rem 0;
      font-variant-numeric: tabular-nums;
    }
    .target-info {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    /* Border-Only Hollow Ring Button */
    .tap-btn {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 3px solid var(--accent-soft);
      background: transparent;
      color: var(--accent-soft);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.1s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      margin: 1.25rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tap-btn:active {
      transform: scale(0.96);
      background: rgba(245, 158, 11, 0.08);
      border-width: 4px;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }
    .control-btn {
      flex: 1;
      padding: 0.65rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .control-btn:active {
      background: var(--border);
    }
    .stats-card {
      background: var(--card);
      border-radius: 16px;
      padding: 1rem 1.25rem;
      border: 1px solid var(--border);
    }
    .stats-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      color: var(--accent-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 0.45rem 0;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
    }
    .stat-row strong {
      color: var(--text);
    }
    .stat-row:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <header>
    <!-- Full Dates Display -->
    <div class="full-date-card">
      <div class="gregorian-text" id="gregorian-date">Loading date...</div>
      <div class="hijri-text" id="hijri-date">Loading Hijri...</div>
    </div>

    <!-- Dhikr Type Selector -->
    <select id="preset-select">
      <option value="Istighfar">Astaghfirullah (Istighfar)</option>
      <option value="SubhanAllah">SubhanAllah</option>
      <option value="Alhamdulillah">Alhamdulillah</option>
      <option value="Allahu Akbar">Allahu Akbar</option>
      <option value="La ilaha illallah">La ilaha illallah</option>
    </select>
  </header>

  <main class="main-card">
    <div class="target-info">Target: <span id="target-count">33</span></div>
    <div class="counter-display" id="count">0</div>
    <button class="tap-btn" id="tap-btn">TAP</button>
    <div class="controls">
      <button class="control-btn" id="reset-btn">Reset</button>
      <button class="control-btn" id="target-btn">Target: 33</button>
    </div>
  </main>

  <!-- Lifetime Totals Section -->
  <section class="stats-card">
    <div class="stats-title">
      <span>Total Cumulative Dhikr</span>
    </div>
    <div id="lifetime-list"></div>
  </section>

  <!-- Look Back / History Section -->
  <section class="stats-card">
    <div class="stats-title">
      <span>Look Back at History</span>
    </div>
    <div style="margin-bottom: 0.75rem;">
      <input type="date" id="history-date-picker">
    </div>
    <div class="stat-row">
      <span>Selected Dhikr (<span id="history-dhikr-label">Istighfar</span>):</span>
      <strong id="history-count-selected">0</strong>
    </div>
    <div class="stat-row">
      <span>All Dhikr Total on this Date:</span>
      <strong id="history-count-total">0</strong>
    </div>
  </section>

  <script>
    let currentDhikr = localStorage.getItem('tasbih_dhikr') || 'Istighfar';
    let count = parseInt(localStorage.getItem('tasbih_session_count') || '0');
    let target = parseInt(localStorage.getItem('tasbih_target') || '33');

    const DHIKR_LIST = [
      'Istighfar',
      'SubhanAllah',
      'Alhamdulillah',
      'Allahu Akbar',
      'La ilaha illallah'
    ];

    const presetSelect = document.getElementById('preset-select');
    const countEl = document.getElementById('count');
    const targetEl = document.getElementById('target-count');
    const tapBtn = document.getElementById('tap-btn');
    const resetBtn = document.getElementById('reset-btn');
    const targetBtn = document.getElementById('target-btn');
    const gregorianDateEl = document.getElementById('gregorian-date');
    const hijriDateEl = document.getElementById('hijri-date');
    const lifetimeListEl = document.getElementById('lifetime-list');
    const historyDatePicker = document.getElementById('history-date-picker');
    const historyDhikrLabel = document.getElementById('history-dhikr-label');
    const historyCountSelected = document.getElementById('history-count-selected');
    const historyCountTotal = document.getElementById('history-count-total');

    presetSelect.value = currentDhikr;

    const todayStr = new Date().toISOString().split('T')[0];
    historyDatePicker.value = todayStr;

    function renderDates() {
      const now = new Date();
      const gregOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      gregorianDateEl.textContent = now.toLocaleDateString('en-GB', gregOptions);

      try {
        const hijriFormatter = new Intl.DateTimeFormat('en-TN-u-ca-islamic-uma', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
        hijriDateEl.textContent = `${hijriFormatter.format(now)} AH`;
      } catch (e) {
        const fallback = new Intl.DateTimeFormat('en-US-u-ca-islamic', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
        hijriDateEl.textContent = fallback.format(now);
      }
    }

    function getLogs() {
      return JSON.parse(localStorage.getItem('tasbih_logs_v2') || '{}');
    }

    function saveTap(dhikrType) {
      const logs = getLogs();
      const dateKey = new Date().toISOString().split('T')[0];

      if (!logs[dateKey]) logs[dateKey] = {};
      if (!logs[dateKey][dhikrType]) logs[dateKey][dhikrType] = 0;

      logs[dateKey][dhikrType] += 1;
      localStorage.setItem('tasbih_logs_v2', JSON.stringify(logs));
    }

    function updateLifetimeTotals() {
      const logs = getLogs();
      const totals = {};
      DHIKR_LIST.forEach(item => totals[item] = 0);

      Object.keys(logs).forEach(dateKey => {
        Object.keys(logs[dateKey]).forEach(dhikr => {
          if (totals[dhikr] !== undefined) {
            totals[dhikr] += logs[dateKey][dhikr];
          }
        });
      });

      lifetimeListEl.innerHTML = '';
      DHIKR_LIST.forEach(item => {
        const row = document.createElement('div');
        row.className = 'stat-row';
        row.innerHTML = `<span>${item}</span><strong>${totals[item]}</strong>`;
        lifetimeListEl.appendChild(row);
      });
    }

    function updateHistoryView() {
      const logs = getLogs();
      const selectedDate = historyDatePicker.value;
      historyDhikrLabel.textContent = currentDhikr;

      if (logs[selectedDate]) {
        const selectedCount = logs[selectedDate][currentDhikr] || 0;
        let dayTotal = 0;
        Object.values(logs[selectedDate]).forEach(val => dayTotal += val);

        historyCountSelected.textContent = selectedCount;
        historyCountTotal.textContent = dayTotal;
      } else {
        historyCountSelected.textContent = '0';
        historyCountTotal.textContent = '0';
      }
    }

    function updateUI() {
      countEl.textContent = count;
      targetEl.textContent = target;
      targetBtn.textContent = `Target: ${target}`;

      updateLifetimeTotals();
      updateHistoryView();

      localStorage.setItem('tasbih_session_count', count);
      localStorage.setItem('tasbih_target', target);
      localStorage.setItem('tasbih_dhikr', currentDhikr);
    }

    tapBtn.addEventListener('click', () => {
      count++;
      saveTap(currentDhikr);

      if ('vibrate' in navigator) navigator.vibrate(30);
      if (count % target === 0 && 'vibrate' in navigator) {
        navigator.vibrate([80, 40, 80]);
      }
      updateUI();
    });

    presetSelect.addEventListener('change', (e) => {
      currentDhikr = e.target.value;
      count = 0;
      updateUI();
    });

    resetBtn.addEventListener('click', () => {
      if (confirm('Reset active session counter?')) {
        count = 0;
        updateUI();
      }
    });

    targetBtn.addEventListener('click', () => {
      if (target === 33) target = 100;
      else if (target === 100) target = 1000;
      else target = 33;
      updateUI();
    });

    historyDatePicker.addEventListener('change', updateHistoryView);

    renderDates();
    updateUI();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
