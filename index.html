<!DOCTYPE html>
<html lang="en" data-theme="charcoal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline Tasbih PWA</title>
  <link id="manifest-placeholder" rel="manifest">
  <style>
    /* --- CSS Variables & Theme Definitions --- */
    :root {
      --bg-primary: #0a0a0a;
      --bg-surface: #141414;
      --bg-card: #1f1f1f;
      --border-color: #2e2e2e;
      --text-main: #f0f0f0;
      --text-muted: #8e8e93;
      --accent: #2e7d32;
      --accent-hover: #388e3c;
      --accent-light: rgba(46, 125, 50, 0.15);
      --danger: #d32f2f;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    [data-theme="emerald"] {
      --bg-primary: #04140c;
      --bg-surface: #0a2417;
      --bg-card: #123524;
      --border-color: #1b4d35;
      --text-main: #e8f5e9;
      --text-muted: #81c784;
      --accent: #1b5e20;
      --accent-hover: #2e7d32;
      --accent-light: rgba(27, 94, 32, 0.2);
    }

    [data-theme="midnight"] {
      --bg-primary: #030814;
      --bg-surface: #0a1329;
      --bg-card: #121e3d;
      --border-color: #1e2f57;
      --text-main: #e1e9f8;
      --text-muted: #7995c4;
      --accent: #1565c0;
      --accent-hover: #1e88e5;
      --accent-light: rgba(21, 101, 192, 0.2);
    }

    [data-theme="sand"] {
      --bg-primary: #120e0a;
      --bg-surface: #211a14;
      --bg-card: #2e251d;
      --border-color: #42362b;
      --text-main: #f5efe6;
      --text-muted: #b8a695;
      --accent: #b78103;
      --accent-hover: #d4970c;
      --accent-light: rgba(183, 129, 3, 0.2);
    }

    /* --- Core Layout & Reset --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .date-display {
      display: flex;
      flex-direction: column;
    }

    .date-gregorian {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .date-hijri {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .icon-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }

    main {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      flex-grow: 1;
      justify-content: center;
    }

    .controls-bar {
      width: 100%;
      display: flex;
      gap: 8px;
    }

    select, button {
      font-family: inherit;
    }

    .preset-select {
      flex-grow: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      outline: none;
    }

    /* --- Main Tap Interface --- */
    .tap-area {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      position: relative;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.05s ease, background-color 0.2s ease;
    }

    .tap-area:active {
      transform: scale(0.98);
      background: var(--bg-card);
    }

    .tap-area.pulse {
      animation: visualPulse 0.4s ease-out;
    }

    @keyframes visualPulse {
      0% { box-shadow: 0 0 0 0ms var(--accent); }
      50% { box-shadow: 0 0 0 12px var(--accent-light); }
      100% { box-shadow: 0 0 0 0ms rgba(0,0,0,0); }
    }

    .counter-display {
      font-size: 5rem;
      font-weight: 700;
      line-height: 1;
      margin: 12px 0;
      font-variant-numeric: tabular-nums;
    }

    .target-info {
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }

    /* --- Action Buttons --- */
    .action-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-accent {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* --- History & Stats Panels --- */
    .dashboard-panel {
      width: 100%;
      max-width: 480px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 8px;
    }

    .panel-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px dashed var(--border-color);
      font-size: 0.9rem;
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .edit-icon-btn, .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      margin-left: 4px;
    }

    /* --- Modals & Overlay --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .input-field {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      outline: none;
      font-size: 0.95rem;
      width: 100%;
    }

    /* --- Focus Mode Overrides --- */
    body.focus-mode header,
    body.focus-mode .controls-bar,
    body.focus-mode .action-grid,
    body.focus-mode .dashboard-panel {
      display: none !important;
    }

    body.focus-mode .tap-area {
      height: 80vh;
    }

    .unhide-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 100;
    }

    .unhide-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header>
    <div class="date-display">
      <span class="date-hijri" id="hijri-date">--</span>
      <span class="date-gregorian" id="gregorian-date">--</span>
    </div>
    <button class="icon-btn" id="settings-open-btn" aria-label="Settings">⚙️</button>
  </header>

  <!-- Main Display Area -->
  <main>
    <div class="controls-bar">
      <select id="preset-select" class="preset-select"></select>
    </div>

    <div class="tap-area" id="tap-btn">
      <div class="target-info" id="target-info-label">Target: <span id="target-count">33</span></div>
      <div class="counter-display" id="count">0</div>
      <div style="font-size: 0.8rem; color: var(--text-muted);">Tap anywhere inside</div>
    </div>

    <div class="action-grid">
      <button class="btn" id="reset-btn">🔄 Reset</button>
      <button class="btn" id="target-btn">🎯 Target</button>
      <button class="btn btn-accent" id="focus-toggle-btn">🔍 Focus</button>
    </div>

    <!-- Cumulative Dhikr Today Section -->
    <div class="dashboard-panel">
      <div class="panel-title">Cumulative Dhikr Today</div>
      <div id="today-dhikr-list"></div>
      <div class="stat-row" style="margin-top: 8px; font-weight: bold; border-top: 1px solid var(--border-color); padding-top: 8px;">
        <span>Grand Total</span>
        <strong id="today-grand-total">0</strong>
      </div>
    </div>

    <!-- Look Back at History Section -->
    <div class="dashboard-panel">
      <div class="panel-title">Look Back at History</div>
      <div class="stat-row" style="margin-bottom: 12px; font-weight: bold;">
        <span>All-Time Dhikr Total</span>
        <strong id="all-time-dhikr-total">0</strong>
      </div>
      <div class="setting-row" style="margin-bottom: 8px;">
        <input type="date" id="history-date-picker" class="input-field" style="width: auto;">
      </div>
      <div id="history-day-dhikr-list"></div>
      <div class="stat-row" style="margin-top: 8px; font-weight: bold; border-top: 1px solid var(--border-color); padding-top: 8px;">
        <span>Day Grand Total</span>
        <strong id="history-count-total">0</strong>
      </div>
    </div>
  </main>

  <button class="btn unhide-btn" id="unhide-btn">Exit Focus</button>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Settings</div>
        <button class="icon-btn" id="settings-close-btn">✕</button>
      </div>

      <div class="setting-group">
        <label class="setting-row">
          <span>Theme</span>
          <select id="theme-select" class="input-field" style="width: auto;">
            <option value="charcoal">OLED Charcoal</option>
            <option value="emerald">Emerald Oasis</option>
            <option value="midnight">Midnight Blue</option>
            <option value="sand">Desert Sand</option>
          </select>
        </label>
      </div>

      <div class="setting-group">
        <label class="setting-row">
          <span>Audio Alert</span>
          <input type="checkbox" id="sound-toggle">
        </label>
        <label class="setting-row">
          <span>Tone Type</span>
          <select id="tone-select" class="input-field" style="width: auto;">
            <option value="chime">Chime</option>
            <option value="bell">Bell</option>
            <option value="pulse">Pulse</option>
          </select>
        </label>
        <label class="setting-row">
          <span>Volume</span>
          <input type="range" id="volume-range" min="0" max="1" step="0.1" style="width: 50%;">
        </label>
      </div>

      <div class="setting-group">
        <label class="setting-row">
          <span>Vibration (Haptic)</span>
          <input type="checkbox" id="vibe-toggle">
        </label>
        <label class="setting-row">
          <span>Visual Pulse Alert</span>
          <input type="checkbox" id="visual-haptic-toggle">
        </label>
        <label class="setting-row">
          <span>Focus Mode</span>
          <input type="checkbox" id="focus-toggle-setting">
        </label>
      </div>

      <div class="setting-group">
        <div class="modal-title" style="font-size: 0.95rem; margin-top: 8px;">Manage Custom Phrases</div>
        <div id="custom-dhikr-manager-list"></div>
      </div>

      <div class="setting-group">
        <div class="modal-title" style="font-size: 0.95rem; margin-top: 8px;">Data Management</div>
        <div style="display: flex; gap: 8px;">
          <button class="btn" id="export-data-btn" style="flex: 1;">Export Backup</button>
          <button class="btn" id="import-data-btn" style="flex: 1;">Import Backup</button>
          <input type="file" id="import-file-input" accept=".json" style="display: none;">
        </div>
      </div>
    </div>
  </div>

  <!-- Custom Input Modal -->
  <div class="modal-overlay" id="input-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="input-modal-title">Enter Value</div>
        <button class="icon-btn" id="input-modal-close">✕</button>
      </div>
      <input type="text" id="input-modal-field" class="input-field">
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn" id="input-modal-cancel">Cancel</button>
        <button class="btn btn-accent" id="input-modal-submit">Save</button>
      </div>
    </div>
  </div>

  <!-- Custom Confirm Modal -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="confirm-modal-title">Confirm</div>
        <button class="icon-btn" id="confirm-modal-close">✕</button>
      </div>
      <div id="confirm-modal-message" style="font-size: 0.95rem; color: var(--text-muted);">Are you sure?</div>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn" id="confirm-modal-cancel">Cancel</button>
        <button class="btn btn-accent" id="confirm-modal-submit">Confirm</button>
      </div>
    </div>
  </div>

  <!-- App Script Logic -->
  <script>
    // --- 1. Service Worker & PWA Manifest Auto-Installer ---
    (function registerDynamicPWA() {
      const manifestData = {
        name: "Offline Tasbih",
        short_name: "Tasbih",
        start_url: "./",
        display: "standalone",
        background_color: "#0a0a0a",
        theme_color: "#0a0a0a",
        icons: [{
          src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='%23000000'/><g fill='%23FFFFFF'><circle cx='256' cy='140' r='18'/><circle cx='310' cy='155' r='18'/><circle cx='355' cy='190' r='18'/><circle cx='380' cy='240' r='18'/><circle cx='380' cy='295' r='18'/><circle cx='355' cy='345' r='18'/><circle cx='310' cy='380' r='18'/><circle cx='256' cy='395' r='18'/><circle cx='202' cy='380' r='18'/><circle cx='157' cy='345' r='18'/><circle cx='132' cy='295' r='18'/><circle cx='132' cy='240' r='18'/><circle cx='157' cy='190' r='18'/><circle cx='202' cy='155' r='18'/></g></svg>",
          sizes: "192x192 512x512",
          type: "image/svg+xml"
        }]
      };
      
      const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
      document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

      if ('serviceWorker' in navigator) {
        const swCode = `
          const CACHE_NAME = 'tasbih-v3';
          self.addEventListener('install', (e) => {
            e.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(['./'])));
            self.skipWaiting();
          });
          self.addEventListener('fetch', (e) => {
            e.respondWith(
              caches.match(e.request).then((res) => res || fetch(e.request).catch(() => caches.match('./')))
            );
          });
        `;
        const swBlob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
      }
    })();

    // --- 2. Core App State & Logic ---
    const HIJRI_MONTHS = [
      "Muharram", "Safar", "Rabi' al-Awwal", "Rabi' al-Thani",
      "Jumada al-Awwal", "Jumada al-Thani", "Rajab", "Sha'ban",
      "Ramadan", "Shawwal", "Dhu al-Qi'dah", "Dhu al-Hijjah"
    ];

    const DEFAULT_DHIKRS = ['Istighfar', 'SubhanAllah', 'Alhamdulillah', 'Allahu Akbar', 'La ilaha illallah'];

    function getStoredDhikrs() {
      const stored = localStorage.getItem('tasbih_all_dhikrs');
      if (!stored) {
        localStorage.setItem('tasbih_all_dhikrs', JSON.stringify(DEFAULT_DHIKRS));
        return DEFAULT_DHIKRS;
      }
      return JSON.parse(stored);
    }

    let allDhikrList = getStoredDhikrs();
    let currentDhikr = localStorage.getItem('tasbih_dhikr') || allDhikrList[0] || 'Istighfar';
    let count = parseInt(localStorage.getItem('tasbih_session_count') || '0');
    let target = parseInt(localStorage.getItem('tasbih_target') || '33');
    let soundEnabled = localStorage.getItem('tasbih_sound') !== 'false';
    let vibeEnabled = localStorage.getItem('tasbih_vibe') !== 'false';
    let visualHapticEnabled = localStorage.getItem('tasbih_visual_pulse') !== 'false';
    let alertTone = localStorage.getItem('tasbih_alert_tone') || 'chime';
    let alertVolume = parseFloat(localStorage.getItem('tasbih_volume') || '0.3');
    let currentTheme = localStorage.getItem('tasbih_theme') || 'charcoal';
    let focusMode = false;
    let unhideTimeout = null;

    function setCleanURL(dhikrName) {
      if (window.history && window.history.replaceState) {
        const cleanSlug = encodeURIComponent(dhikrName.toLowerCase().replace(/\s+/g, '-'));
        window.history.replaceState({}, '', `?dhikr=${cleanSlug}`);
      }
    }

    const presetSelect = document.getElementById('preset-select');
    const countEl = document.getElementById('count');
    const targetEl = document.getElementById('target-count');
    const targetInfoLabel = document.getElementById('target-info-label');
    const tapBtn = document.getElementById('tap-btn');
    const resetBtn = document.getElementById('reset-btn');
    const targetBtn = document.getElementById('target-btn');
    const gregorianDateEl = document.getElementById('gregorian-date');
    const hijriDateEl = document.getElementById('hijri-date');
    
    const todayDhikrListEl = document.getElementById('today-dhikr-list');
    const todayGrandTotalEl = document.getElementById('today-grand-total');
    
    const allTimeDhikrTotalEl = document.getElementById('all-time-dhikr-total');
    const historyDatePicker = document.getElementById('history-date-picker');
    const historyDayDhikrListEl = document.getElementById('history-day-dhikr-list');
    const historyCountTotal = document.getElementById('history-count-total');
    
    const settingsModal = document.getElementById('settings-modal');
    const settingsOpenBtn = document.getElementById('settings-open-btn');
    const settingsCloseBtn = document.getElementById('settings-close-btn');
    const themeSelect = document.getElementById('theme-select');
    const soundToggle = document.getElementById('sound-toggle');
    const toneSelect = document.getElementById('tone-select');
    const volumeRange = document.getElementById('volume-range');
    const visualHapticToggle = document.getElementById('visual-haptic-toggle');
    const vibeToggle = document.getElementById('vibe-toggle');
    const focusToggleBtn = document.getElementById('focus-toggle-btn');
    const focusToggleSetting = document.getElementById('focus-toggle-setting');
    const unhideBtn = document.getElementById('unhide-btn');
    const customDhikrManagerList = document.getElementById('custom-dhikr-manager-list');

    // Modals
    const inputModal = document.getElementById('input-modal');
    const inputModalTitle = document.getElementById('input-modal-title');
    const inputModalField = document.getElementById('input-modal-field');
    const inputModalSubmit = document.getElementById('input-modal-submit');
    const inputModalCancel = document.getElementById('input-modal-cancel');
    const inputModalClose = document.getElementById('input-modal-close');

    const confirmModal = document.getElementById('confirm-modal');
    const confirmModalTitle = document.getElementById('confirm-modal-title');
    const confirmModalMessage = document.getElementById('confirm-modal-message');
    const confirmModalSubmit = document.getElementById('confirm-modal-submit');
    const confirmModalCancel = document.getElementById('confirm-modal-cancel');
    const confirmModalClose = document.getElementById('confirm-modal-close');

    let onModalSubmitCallback = null;
    let onConfirmSubmitCallback = null;

    function showCustomInputModal(title, initialValue, inputType = 'text', onSubmit) {
      inputModalTitle.textContent = title;
      inputModalField.type = inputType;
      inputModalField.value = initialValue;
      onModalSubmitCallback = onSubmit;
      inputModal.style.display = 'flex';
      setTimeout(() => inputModalField.focus(), 100);
    }

    function hideCustomInputModal() {
      inputModal.style.display = 'none';
      onModalSubmitCallback = null;
    }

    function showCustomConfirmModal(title, message, onConfirm) {
      confirmModalTitle.textContent = title;
      confirmModalMessage.textContent = message;
      onConfirmSubmitCallback = onConfirm;
      confirmModal.style.display = 'flex';
    }

    function hideCustomConfirmModal() {
      confirmModal.style.display = 'none';
      onConfirmSubmitCallback = null;
    }

    inputModalSubmit.addEventListener('click', () => {
      if (onModalSubmitCallback) onModalSubmitCallback(inputModalField.value);
      hideCustomInputModal();
    });
    inputModalCancel.addEventListener('click', hideCustomInputModal);
    inputModalClose.addEventListener('click', hideCustomInputModal);

    confirmModalSubmit.addEventListener('click', () => {
      if (onConfirmSubmitCallback) onConfirmSubmitCallback();
      hideCustomConfirmModal();
    });
    confirmModalCancel.addEventListener('click', hideCustomConfirmModal);
    confirmModalClose.addEventListener('click', hideCustomConfirmModal);

    function renderDhikrOptions() {
      presetSelect.innerHTML = '';
      
      allDhikrList.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        presetSelect.appendChild(opt);
      });

      const customOpt = document.createElement('option');
      customOpt.value = '__custom__';
      customOpt.textContent = '+ Add Custom Dhikr...';
      presetSelect.appendChild(customOpt);

      if (!allDhikrList.includes(currentDhikr)) {
        currentDhikr = allDhikrList[0] || 'Istighfar';
      }

      presetSelect.value = currentDhikr;
      renderCustomManagerList();
      setCleanURL(currentDhikr);
    }

    function renderCustomManagerList() {
      customDhikrManagerList.innerHTML = '';
      if (allDhikrList.length === 0) {
        customDhikrManagerList.innerHTML = '<div style="font-size: 0.8rem; color: var(--text-muted);">No dhikrs available.</div>';
        return;
      }

      allDhikrList.forEach(item => {
        const row = document.createElement('div');
        row.className = 'stat-row';
        row.innerHTML = `
          <span>${item}</span>
          <button class="delete-btn" title="Delete Dhikr">🗑️</button>
        `;
        row.querySelector('.delete-btn').addEventListener('click', () => deleteDhikr(item));
        customDhikrManagerList.appendChild(row);
      });
    }

    function deleteDhikr(dhikrToDelete) {
      showCustomConfirmModal(
        'Delete Dhikr',
        `Are you sure you want to remove "${dhikrToDelete}"?`,
        () => {
          allDhikrList = allDhikrList.filter(item => item !== dhikrToDelete);
          localStorage.setItem('tasbih_all_dhikrs', JSON.stringify(allDhikrList));
          
          if (currentDhikr === dhikrToDelete) {
            currentDhikr = allDhikrList[0] || 'Istighfar';
            count = 0;
          }
          renderDhikrOptions();
          updateUI();
        }
      );
    }

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playGoalTone() {
      if (!soundEnabled) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        if (alertTone === 'bell') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
        } else if (alertTone === 'pulse') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(329.63, audioCtx.currentTime);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        }

        gain.gain.setValueAtTime(alertVolume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      } catch (e) {}
    }

    function triggerVisualPulse() {
      if (!visualHapticEnabled) return;
      tapBtn.classList.remove('pulse');
      void tapBtn.offsetWidth;
      tapBtn.classList.add('pulse');
    }

    function triggerVibration(pattern) {
      if (vibeEnabled && 'vibrate' in navigator) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeSelect.value = theme;
      localStorage.setItem('tasbih_theme', theme);
    }

    function renderDates() {
      const now = new Date();
      const gregOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      gregorianDateEl.textContent = now.toLocaleDateString('en-GB', gregOptions);

      try {
        const parts = new Intl.DateTimeFormat('en-u-ca-islamic-num', {
          day: 'numeric', month: 'numeric', year: 'numeric'
        }).formatToParts(now);

        let day = '', monthIdx = 0, year = '';
        parts.forEach(p => {
          if (p.type === 'day') day = p.value;
          if (p.type === 'month') monthIdx = parseInt(p.value, 10) - 1;
          if (p.type === 'year') year = p.value;
        });

        const monthName = HIJRI_MONTHS[monthIdx] || "Hijri";
        hijriDateEl.textContent = `${day} ${monthName} ${year} AH`;
      } catch (e) {
        hijriDateEl.textContent = now.toLocaleDateString();
      }
    }

    function getLogs() {
      return JSON.parse(localStorage.getItem('tasbih_logs_v2') || '{}');
    }

    function getManualOffsets() {
      return JSON.parse(localStorage.getItem('tasbih_offsets') || '{}');
    }

    function saveTap(dhikrType) {
      const logs = getLogs();
      const dateKey = new Date().toISOString().split('T')[0];

      if (!logs[dateKey]) logs[dateKey] = {};
      if (!logs[dateKey][dhikrType]) logs[dateKey][dhikrType] = 0;

      logs[dateKey][dhikrType] += 1;
      localStorage.setItem('tasbih_logs_v2', JSON.stringify(logs));
    }

    function updateTodayCumulative() {
      const logs = getLogs();
      const todayKey = new Date().toISOString().split('T')[0];
      const todayLogs = logs[todayKey] || {};

      todayDhikrListEl.innerHTML = '';
      let todayGrandTotal = 0;

      allDhikrList.forEach(dhikr => {
        const cnt = todayLogs[dhikr] || 0;
        todayGrandTotal += cnt;

        const row = document.createElement('div');
        row.className = 'stat-row';
        row.innerHTML = `
          <span>${dhikr}</span>
          <strong>${cnt}</strong>
        `;
        todayDhikrListEl.appendChild(row);
      });

      todayGrandTotalEl.textContent = todayGrandTotal.toLocaleString();
    }

    function updateAllTimeTotal() {
      const logs = getLogs();
      const offsets = getManualOffsets();
      let grandTotal = 0;

      Object.keys(offsets).forEach(dhikr => {
        grandTotal += offsets[dhikr] || 0;
      });

      Object.keys(logs).forEach(dateKey => {
        Object.keys(logs[dateKey]).forEach(dhikr => {
          grandTotal += logs[dateKey][dhikr];
        });
      });

      if (allTimeDhikrTotalEl) {
        allTimeDhikrTotalEl.textContent = grandTotal.toLocaleString();
      }
    }

    function editCurrentCounter() {
      showCustomInputModal(`Edit Current Session Count`, count, 'number', (val) => {
        const parsed = parseInt(val, 10);
        if (!isNaN(parsed) && parsed >= 0) {
          count = parsed;
          updateUI();
        }
      });
    }

    function updateHistoryView() {
      const logs = getLogs();
      const selectedDate = historyDatePicker.value;
      const dayLogs = logs[selectedDate] || {};

      historyDayDhikrListEl.innerHTML = '';
      let dayGrandTotal = 0;

      allDhikrList.forEach(dhikr => {
        const cnt = dayLogs[dhikr] || 0;
        dayGrandTotal += cnt;

        const row = document.createElement('div');
        row.className = 'stat-row';
        row.innerHTML = `
          <span>${dhikr}</span>
          <strong>${cnt}</strong>
        `;
        historyDayDhikrListEl.appendChild(row);
      });

      historyCountTotal.textContent = dayGrandTotal.toLocaleString();
    }

    function toggleFocusMode(state) {
      focusMode = state;
      focusToggleSetting.checked = focusMode;
      if (focusMode) {
        document.body.classList.add('focus-mode');
      } else {
        document.body.classList.remove('focus-mode');
        unhideBtn.classList.remove('visible');
      }
    }

    function revealUnhideButton() {
      if (!focusMode) return;
      unhideBtn.classList.add('visible');
      clearTimeout(unhideTimeout);
      unhideTimeout = setTimeout(() => {
        unhideBtn.classList.remove('visible');
      }, 3000);
    }

    function handleTapAction() {
      initAudio();
      count++;
      saveTap(currentDhikr);

      triggerVibration(30);

      if (count % target === 0) {
        triggerVibration([100, 50, 100, 50, 150]);
        playGoalTone();
        triggerVisualPulse();
      }

      updateUI();
    }

    function promptCustomTarget() {
      showCustomInputModal('Set Custom Target Count', target, 'number', (val) => {
        const parsed = parseInt(val, 10);
        if (!isNaN(parsed) && parsed > 0) {
          target = parsed;
          updateUI();
        }
      });
    }

    function updateUI() {
      countEl.textContent = count;
      targetEl.textContent = target;
      targetBtn.textContent = `Target: ${target}`;

      updateTodayCumulative();
      updateAllTimeTotal();
      updateHistoryView();

      localStorage.setItem('tasbih_session_count', count);
      localStorage.setItem('tasbih_target', target);
      localStorage.setItem('tasbih_dhikr', currentDhikr);
    }

    // --- Data Export & Import ---
    document.getElementById('export-data-btn').addEventListener('click', () => {
      const exportObject = {
        logs: getLogs(),
        offsets: getManualOffsets(),
        allDhikrs: allDhikrList,
        version: 3
      };
      const blob = new Blob([JSON.stringify(exportObject, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `tasbih-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    });

    const importFileInput = document.getElementById('import-file-input');
    document.getElementById('import-data-btn').addEventListener('click', () => importFileInput.click());

    importFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (data.logs) localStorage.setItem('tasbih_logs_v2', JSON.stringify(data.logs));
          if (data.offsets) localStorage.setItem('tasbih_offsets', JSON.stringify(data.offsets));
          if (data.allDhikrs) {
            allDhikrList = data.allDhikrs;
            localStorage.setItem('tasbih_all_dhikrs', JSON.stringify(allDhikrList));
          }
          renderDhikrOptions();
          updateUI();
          alert('Backup restored successfully!');
        } catch (err) {
          alert('Invalid backup file format.');
        }
      };
      reader.readAsText(file);
    });

    // --- Listeners ---
    countEl.addEventListener('click', editCurrentCounter);

    document.addEventListener('pointerdown', (e) => {
      if (focusMode && !tapBtn.contains(e.target) && !unhideBtn.contains(e.target)) {
        revealUnhideButton();
      }
    });

    tapBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      e.preventDefault();
      handleTapAction();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && settingsModal.style.display !== 'flex' && inputModal.style.display !== 'flex' && confirmModal.style.display !== 'flex') {
        e.preventDefault();
        handleTapAction();
      }
    });

    presetSelect.addEventListener('change', (e) => {
      if (e.target.value === '__custom__') {
        showCustomInputModal('Add Custom Dhikr Phrase', '', 'text', (input) => {
          if (input && input.trim().length > 0) {
            const formatted = input.trim();
            if (!allDhikrList.includes(formatted)) {
              allDhikrList.push(formatted);
              localStorage.setItem('tasbih_all_dhikrs', JSON.stringify(allDhikrList));
            }
            currentDhikr = formatted;
          }
          renderDhikrOptions();
          updateUI();
        });
      } else {
        currentDhikr = e.target.value;
        count = 0;
        renderDhikrOptions();
        updateUI();
      }
    });

    resetBtn.addEventListener('click', () => {
      showCustomConfirmModal(
        'Reset Session',
        'Reset active session counter for this dhikr?',
        () => {
          count = 0;
          updateUI();
        }
      );
    });

    targetBtn.addEventListener('click', () => {
      if (target === 33) target = 100;
      else if (target === 100) target = 1000;
      else target = 33;
      updateUI();
    });

    targetInfoLabel.addEventListener('click', promptCustomTarget);

    settingsOpenBtn.addEventListener('click', () => settingsModal.style.display = 'flex');
    settingsCloseBtn.addEventListener('click', () => settingsModal.style.display = 'none');
    themeSelect.addEventListener('change', (e) => applyTheme(e.target.value));
    
    soundToggle.addEventListener('change', (e) => {
      soundEnabled = e.target.checked;
      localStorage.setItem('tasbih_sound', soundEnabled);
    });

    toneSelect.value = alertTone;
    toneSelect.addEventListener('change', (e) => {
      alertTone = e.target.value;
      localStorage.setItem('tasbih_alert_tone', alertTone);
      playGoalTone();
    });

    volumeRange.value = alertVolume;
    volumeRange.addEventListener('input', (e) => {
      alertVolume = parseFloat(e.target.value);
      localStorage.setItem('tasbih_volume', alertVolume);
    });

    visualHapticToggle.checked = visualHapticEnabled;
    visualHapticToggle.addEventListener('change', (e) => {
      visualHapticEnabled = e.target.checked;
      localStorage.setItem('tasbih_visual_pulse', visualHapticEnabled);
    });

    vibeToggle.addEventListener('change', (e) => {
      vibeEnabled = e.target.checked;
      localStorage.setItem('tasbih_vibe', vibeEnabled);
    });

    focusToggleBtn.addEventListener('click', () => toggleFocusMode(true));
    unhideBtn.addEventListener('click', () => toggleFocusMode(false));
    focusToggleSetting.addEventListener('change', (e) => toggleFocusMode(e.target.checked));

    historyDatePicker.value = new Date().toISOString().split('T')[0];
    historyDatePicker.addEventListener('change', updateHistoryView);

    soundToggle.checked = soundEnabled;
    vibeToggle.checked = vibeEnabled;
    renderDhikrOptions();
    applyTheme(currentTheme);
    renderDates();
    updateUI();
  </script>
</body>
</html>
