<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline Tasbih</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d9488">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #0d9488;
      --accent-hover: #14b8a6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem;
    }
    header {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      border: 1px solid #334155;
      font-size: 1rem;
      margin-top: 1rem;
      outline: none;
    }
    .main-card {
      background: var(--card);
      border-radius: 24px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .counter-display {
      font-size: 5rem;
      font-weight: 800;
      color: var(--accent-hover);
      line-height: 1;
      margin: 1rem 0;
      font-variant-numeric: tabular-nums;
    }
    .target-info {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .tap-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, var(--accent-hover), var(--accent));
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(13, 148, 136, 0.4);
      transition: transform 0.05s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tap-btn:active {
      transform: scale(0.95);
    }
    .controls {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
      width: 100%;
    }
    .control-btn {
      flex: 1;
      padding: 0.75rem;
      border-radius: 12px;
      border: 1px solid #334155;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .control-btn:active {
      background: #334155;
    }
  </style>
</head>
<body>

  <header>
    <h2>Offline Tasbih</h2>
    <select id="preset-select">
      <option value="SubhanAllah">SubhanAllah (Subhan-Allah)</option>
      <option value="Alhamdulillah">Alhamdulillah (Praise be to Allah)</option>
      <option value="Allahu Akbar">Allahu Akbar (Allah is Greatest)</option>
      <option value="Astaghfirullah">Astaghfirullah (I seek forgiveness)</option>
      <option value="La ilaha illallah">La ilaha illallah (None worthy of worship but Allah)</option>
    </select>
  </header>

  <main class="main-card">
    <div class="target-info">Target: <span id="target-count">33</span></div>
    <div class="counter-display" id="count">0</div>
    <button class="tap-btn" id="tap-btn">TAP</button>
    <div class="controls">
      <button class="control-btn" id="reset-btn">Reset</button>
      <button class="control-btn" id="target-btn">Target: 33</button>
    </div>
  </main>

  <footer style="color: var(--text-muted); font-size: 0.8rem;">
    Sadaqah Jariya App • Works 100% Offline
  </footer>

  <script>
    let count = parseInt(localStorage.getItem('tasbih_count') || '0');
    let target = parseInt(localStorage.getItem('tasbih_target') || '33');

    const countEl = document.getElementById('count');
    const targetEl = document.getElementById('target-count');
    const tapBtn = document.getElementById('tap-btn');
    const resetBtn = document.getElementById('reset-btn');
    const targetBtn = document.getElementById('target-btn');

    function updateUI() {
      countEl.textContent = count;
      targetEl.textContent = target;
      targetBtn.textContent = `Target: ${target}`;
      localStorage.setItem('tasbih_count', count);
      localStorage.setItem('tasbih_target', target);
    }

    tapBtn.addEventListener('click', () => {
      count++;
      if ('vibrate' in navigator) navigator.vibrate(40);
      if (count % target === 0 && 'vibrate' in navigator) {
        navigator.vibrate([100, 50, 100]);
      }
      updateUI();
    });

    resetBtn.addEventListener('click', () => {
      if (confirm('Reset current counter?')) {
        count = 0;
        updateUI();
      }
    });

    targetBtn.addEventListener('click', () => {
      if (target === 33) target = 100;
      else if (target === 100) target = 1000;
      else target = 33;
      updateUI();
    });

    updateUI();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
