<!DOCTYPE html>
<html lang="en" data-theme="charcoal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Tasbih Counter</title>
  <style>
    /* --- CSS Reset & Variables --- */
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-border: #2d2d2d;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-soft: #10b981;
      --accent-hover: #059669;
      --btn-bg: #2a2a2a;
      --btn-hover: #374151;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    [data-theme="emerald"] {
      --bg-color: #064e3b;
      --card-bg: #047857;
      --card-border: #059669;
      --text-main: #ecfdf5;
      --text-muted: #a7f3d0;
      --accent-soft: #34d399;
      --accent-hover: #10b981;
      --btn-bg: #065f46;
      --btn-hover: #047857;
    }

    [data-theme="midnight"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-soft: #38bdf8;
      --accent-hover: #0284c7;
      --btn-bg: #1e293b;
      --btn-hover: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1rem;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* --- Container & Layout --- */
    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .header-card, .counter-card, .history-card, .stats-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.25rem;
      box-shadow: var(--shadow);
    }

    /* --- Header --- */
    .header-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .date-display {
      display: flex;
      flex-direction: column;
    }

    .gregorian-date {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .hijri-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    .icon-btn {
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: var(--btn-hover);
    }

    /* --- Controls & Selectors --- */
    .controls-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    select, input[type="date"], input[type="text"], input[type="number"] {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
    }

    select:focus, input:focus {
      border-color: var(--accent-soft);
    }

    /* --- Main Counter Display --- */
    .counter-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 1.25rem;
    }

    .count-display {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      margin: 1rem 0;
      cursor: pointer;
      color: var(--accent-soft);
      transition: transform 0.1s ease;
    }

    .count-display:active {
      transform: scale(0.95);
    }

    .target-info {
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .tap-area {
      width: 100%;
      height: 180px;
      margin-top: 1.5rem;
      background: var(--btn-bg);
      border: 2px dashed var(--card-border);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s, border-color 0.15s;
    }

    .tap-area:active {
      background: var(--btn-hover);
      border-color: var(--accent-soft);
    }

    .tap-area.pulse {
      animation: visualPulse 0.3s ease-out;
    }

    @keyframes visualPulse {
      0% { transform: scale(1); border-color: var(--accent-soft); }
      50% { transform: scale(0.98); background: var(--accent-hover); }
      100% { transform: scale(1); }
    }

    .action-row {
      display: flex;
      width: 100%;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .btn {
      flex: 1;
      padding: 0.6rem 1rem;
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .btn:hover {
      background: var(--btn-hover);
    }

    .btn-danger {
      background: #7f1d1d;
      border-color: #991b1b;
      color: #fca5a5;
    }

    .btn-danger:hover {
      background: #991b1b;
    }

    /* --- Stats & Lifetime List --- */
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.9rem;
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .edit-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      margin-left: 0.3rem;
      opacity: 0.7;
    }

    .edit-icon-btn:hover {
      opacity: 1;
    }

    /* --- Focus Mode Styles --- */
    body.focus-mode .header-card,
    body.focus-mode .history-card,
    body.focus-mode .stats-card,
    body.focus-mode .controls-row,
    body.focus-mode .action-row,
    body.focus-mode .target-info {
      display: none !important;
    }

    body.focus-mode .counter-card {
      border: none;
      background: transparent;
      box-shadow: none;
      height: 80vh;
      justify-content: center;
    }

    body.focus-mode .tap-area {
      height: 60vh;
    }

    .unhide-btn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 1000;
    }

    .unhide-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* --- Modals --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 1rem;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      width: 100%;
      max-width: 400px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .setting-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input[type="date"].has-data {
      border-color: var(--accent-soft);
    }
  </style>
</head>
<body>

  <button id="unhide-btn" class="btn unhide-btn">Exit Focus Mode</button>

  <div class="app-container">
    <!-- Header -->
    <div class="header-card">
      <div class="date-display">
        <span id="gregorian-date" class="gregorian-date">Loading...</span>
        <span id="hijri-date" class="hijri-date">Loading...</span>
      </div>
      <div class="header-actions">
        <button id="focus-toggle-btn" class="icon-btn" title="Toggle Focus Mode">👁️</button>
        <button id="settings-open-btn" class="icon-btn" title="Settings">⚙️</button>
      </div>
    </div>

    <!-- Active Counter Section -->
    <div class="counter-card">
      <div class="controls-row" style="width: 100%;">
        <select id="preset-select"></select>
      </div>

      <div id="count-el" class="count-display">0</div>
      <div id="target-info-label" class="target-info">Target: <span id="target-el">33</span></div>

      <div id="tap-btn" class="tap-area">Tap Anywhere to Count</div>

      <div class="action-row">
        <button id="target-btn" class="btn">Target: 33</button>
        <button id="reset-btn" class="btn btn-danger">Reset</button>
      </div>
    </div>

    <!-- Daily Log/History Filter -->
    <div class="history-card">
      <div style="font-weight:700; margin-bottom:0.75rem; font-size:1rem;">Daily History View</div>
      <div class="controls-row">
        <input type="date" id="history-date-picker">
        <select id="history-dhikr-select"></select>
      </div>
      <div class="stat-row">
        <span>Selected Phrase:</span>
        <strong id="history-count-selected">0</strong>
      </div>
      <div class="stat-row">
        <span>All Phrases Combined (Day):</span>
        <strong id="history-count-total">0</strong>
      </div>
    </div>

    <!-- Lifetime Statistics Section -->
    <div class="stats-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
        <span style="font-weight:700; font-size:1rem;">Lifetime Totals</span>
        <button id="open-offsets-btn" class="icon-btn" style="width:auto; padding:0 0.5rem; font-size:0.75rem;" title="View Adjustments Log">Log 📋</button>
      </div>
      <div id="lifetime-list-el"></div>
      <div class="stat-row" style="margin-top:0.5rem; font-weight:700; border-top:1px solid var(--card-border); padding-top:0.5rem;">
        <span>Grand Total:</span>
        <strong id="history-all-time-total">0</strong>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span>Settings</span>
        <button id="settings-close-btn" class="icon-btn">✕</button>
      </div>

      <div class="setting-group">
        <label class="setting-label">Theme</label>
        <select id="theme-select">
          <option value="charcoal">Charcoal Dark</option>
          <option value="emerald">Emerald Green</option>
          <option value="midnight">Midnight Blue</option>
        </select>
      </div>

      <div class="setting-row">
        <span>Sound Feedback</span>
        <input type="checkbox" id="sound-toggle">
      </div>

      <div class="setting-group">
        <label class="setting-label">Alert Tone</label>
        <select id="tone-select">
          <option value="chime">Chime</option>
          <option value="bell">Bell</option>
          <option value="pulse">Pulse</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">Volume</label>
        <input type="range" id="volume-range" min="0" max="1" step="0.1" value="0.3">
      </div>

      <div class="setting-row">
        <span>Visual Pulse Effect</span>
        <input type="checkbox" id="visual-haptic-toggle">
      </div>

      <div class="setting-row">
        <span>Vibration Feedback</span>
        <input type="checkbox" id="vibe-toggle">
      </div>

      <div class="setting-row">
        <span>Focus Mode</span>
        <input type="checkbox" id="focus-toggle-setting">
      </div>

      <hr style="border:none; border-top:1px solid var(--card-border);">

      <div class="action-row">
        <button id="export-data-btn" class="btn">Export JSON</button>
        <button id="import-data-btn" class="btn">Import JSON</button>
        <input type="file" id="import-file-input" accept=".json" style="display:none;">
      </div>

      <div class="action-row">
        <button id="reset-today-btn" class="btn btn-danger">Reset Today's Logs</button>
        <button id="master-reset-btn" class="btn btn-danger">Master Reset</button>
      </div>
    </div>
  </div>

  <!-- Adjustments Log Modal -->
  <div id="offsets-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span>Manual Adjustments Log</span>
        <button id="offsets-close-btn" class="icon-btn">✕</button>
      </div>
      <div id="offsets-modal-list"></div>
      <button id="clear-offsets-btn" class="btn btn-danger" style="margin-top:0.5rem;">Reset Adjustments</button>
    </div>
  </div>

  <!-- Generic Input Modal -->
  <div id="input-modal" class="modal-overlay">
    <div class="modal-content">
      <div id="input-modal-title" class="modal-header">Input</div>
      <input type="text" id="input-modal-field">
      <div class="action-row">
        <button id="input-modal-cancel" class="btn">Cancel</button>
        <button id="input-modal-confirm" class="btn" style="background:var(--accent-soft); color:#000;">Save</button>
      </div>
    </div>
  </div>

  <!-- Generic Confirm Modal -->
  <div id="confirm-modal" class="modal-overlay">
    <div class="modal-content">
      <div id="confirm-modal-title" class="modal-header">Confirm</div>
      <div id="confirm-modal-message" style="font-size:0.9rem; color:var(--text-muted);">Are you sure?</div>
      <div class="action-row">
        <button id="confirm-modal-cancel" class="btn">Cancel</button>
        <button id="confirm-modal-ok" class="btn btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    // --- Constants & Global Defaults ---
    const DEFAULT_DHIKRS = ['SubhanAllah', 'Alhamdulillah', 'Allahu Akbar', 'Astaghfirullah', 'La ilaha illa Allah'];
    const HIJRI_MONTHS = ['Muharram', 'Safar', 'Rabi al-Awwal', 'Rabi al-Thani', 'Jumada al-Awwal', 'Jumada al-Thani', 'Rajab', 'Sha\'ban', 'Ramadan', 'Shawwal', 'Dhu al-Qi\'dah', 'Dhu al-Hijjah'];

    // --- Application State ---
    let allDhikrList = JSON.parse(localStorage.getItem('tasbih_all_dhikrs')) || DEFAULT_DHIKRS;
    let currentDhikr = localStorage.getItem('tasbih_dhikr') || allDhikrList[0];
    let count = parseInt(localStorage.getItem('tasbih_session_count'), 10) || 0;
    let target = parseInt(localStorage.getItem('tasbih_target'), 10) || 33;
    let soundEnabled = localStorage.getItem('tasbih_sound') !== 'false';
    let vibeEnabled = localStorage.getItem('tasbih_vibe') !== 'false';
    let visualHapticEnabled = localStorage.getItem('tasbih_visual_pulse') !== 'false';
    let alertTone = localStorage.getItem('tasbih_alert_tone') || 'chime';
    let alertVolume = parseFloat(localStorage.getItem('tasbih_volume')) || 0.3;
    let currentTheme = localStorage.getItem('tasbih_theme') || 'charcoal';
    let focusMode = false;
    let unhideTimeout = null;

    // --- DOM Elements ---
    const gregorianDateEl = document.getElementById('gregorian-date');
    const hijriDateEl = document.getElementById('hijri-date');
    const countEl = document.getElementById('count-el');
    const targetEl = document.getElementById('target-el');
    const targetInfoLabel = document.getElementById('target-info-label');
    const tapBtn = document.getElementById('tap-btn');
    const resetBtn = document.getElementById('reset-btn');
    const targetBtn = document.getElementById('target-btn');
    const presetSelect = document.getElementById('preset-select');
    const historyDatePicker = document.getElementById('history-date-picker');
    const historyDhikrSelect = document.getElementById('history-dhikr-select');
    const historyCountSelected = document.getElementById('history-count-selected');
    const historyCountTotal = document.getElementById('history-count-total');
    const lifetimeListEl = document.getElementById('lifetime-list-el');
    const historyAllTimeTotal = document.getElementById('history-all-time-total');
    const focusToggleBtn = document.getElementById('focus-toggle-btn');
    const unhideBtn = document.getElementById('unhide-btn');

    // Settings Modal DOM
    const settingsModal = document.getElementById('settings-modal');
    const settingsOpenBtn = document.getElementById('settings-open-btn');
    const settingsCloseBtn = document.getElementById('settings-close-btn');
    const themeSelect = document.getElementById('theme-select');
    const soundToggle = document.getElementById('sound-toggle');
    const toneSelect = document.getElementById('tone-select');
    const volumeRange = document.getElementById('volume-range');
    const visualHapticToggle = document.getElementById('visual-haptic-toggle');
    const vibeToggle = document.getElementById('vibe-toggle');
    const focusToggleSetting = document.getElementById('focus-toggle-setting');
    const resetTodayBtn = document.getElementById('reset-today-btn');
    const masterResetBtn = document.getElementById('master-reset-btn');

    // Offsets Modal DOM
    const offsetsModal = document.getElementById('offsets-modal');
    const openOffsetsBtn = document.getElementById('open-offsets-btn');
    const offsetsCloseBtn = document.getElementById('offsets-close-btn');
    const offsetsModalList = document.getElementById('offsets-modal-list');
    const clearOffsetsBtn = document.getElementById('clear-offsets-btn');

    // Custom Input/Confirm Modal DOM
    const inputModal = document.getElementById('input-modal');
    const inputModalTitle = document.getElementById('input-modal-title');
    const inputModalField = document.getElementById('input-modal-field');
    const inputModalCancel = document.getElementById('input-modal-cancel');
    const inputModalConfirm = document.getElementById('input-modal-confirm');

    const confirmModal = document.getElementById('confirm-modal');
    const confirmModalTitle = document.getElementById('confirm-modal-title');
    const confirmModalMessage = document.getElementById('confirm-modal-message');
    const confirmModalCancel = document.getElementById('confirm-modal-cancel');
    const confirmModalOk = document.getElementById('confirm-modal-ok');

    // --- Modal Helper Functions ---
    function showCustomInputModal(title, defaultValue, inputType, onConfirm) {
      inputModalTitle.textContent = title;
      inputModalField.type = inputType || 'text';
      inputModalField.value = defaultValue;
      inputModal.style.display = 'flex';
      inputModalField.focus();

      const handleConfirm = () => {
        onConfirm(inputModalField.value);
        closeInputModal();
      };

      const closeInputModal = () => {
        inputModal.style.display = 'none';
        inputModalConfirm.removeEventListener('click', handleConfirm);
      };

      inputModalCancel.onclick = closeInputModal;
      inputModalConfirm.onclick = handleConfirm;
    }

    function showCustomConfirmModal(title, message, onConfirm) {
      confirmModalTitle.textContent = title;
      confirmModalMessage.textContent = message;
      confirmModal.style.display = 'flex';

      const handleConfirm = () => {
        onConfirm();
        closeConfirmModal();
      };

      const closeConfirmModal = () => {
        confirmModal.style.display = 'none';
        confirmModalOk.removeEventListener('click', handleConfirm);
      };

      confirmModalCancel.onclick = closeConfirmModal;
      confirmModalOk.onclick = handleConfirm;
    }

    // --- Option Rendering Helper ---
    function renderDhikrOptions() {
      presetSelect.innerHTML = '';
      historyDhikrSelect.innerHTML = '';

      allDhikrList.forEach(dhikr => {
        const opt1 = document.createElement('option');
        opt1.value = dhikr;
        opt1.textContent = dhikr;
        if (dhikr === currentDhikr) opt1.selected = true;
        presetSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = dhikr;
        opt2.textContent = dhikr;
        historyDhikrSelect.appendChild(opt2);
      });

      const customOpt = document.createElement('option');
      customOpt.value = '__custom__';
      customOpt.textContent = '+ Add Custom Dhikr...';
      presetSelect.appendChild(customOpt);
    }

    // --- Logic Implementation ---
    function deleteDhikr(dhikrToDelete) {
      showCustomConfirmModal(
        'Delete Dhikr',
        `Are you sure you want to remove "${dhikrToDelete}"?`,
        () => {
          allDhikrList = allDhikrList.filter(item => item !== dhikrToDelete);
          localStorage.setItem('tasbih_all_dhikrs', JSON.stringify(allDhikrList));
          
          if (currentDhikr === dhikrToDelete) {
            currentDhikr = allDhikrList[0] || 'Istighfar';
            count = 0;
          }
          renderDhikrOptions();
          updateUI();
        }
      );
    }

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playGoalTone() {
      if (!soundEnabled) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        if (alertTone === 'bell') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
        } else if (alertTone === 'pulse') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(329.63, audioCtx.currentTime);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        }

        gain.gain.setValueAtTime(alertVolume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      } catch (e) {}
    }

    function triggerVisualPulse() {
      if (!visualHapticEnabled) return;
      tapBtn.classList.remove('pulse');
      void tapBtn.offsetWidth;
      tapBtn.classList.add('pulse');
    }

    function triggerVibration(pattern) {
      if (vibeEnabled && 'vibrate' in navigator) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeSelect.value = theme;
      localStorage.setItem('tasbih_theme', theme);
    }

    function renderDates() {
      const now = new Date();
      const gregOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      gregorianDateEl.textContent = now.toLocaleDateString('en-GB', gregOptions);

      try {
        const parts = new Intl.DateTimeFormat('en-u-ca-islamic-num', {
          day: 'numeric', month: 'numeric', year: 'numeric'
        }).formatToParts(now);

        let day = '', monthIdx = 0, year = '';
        parts.forEach(p => {
          if (p.type === 'day') day = p.value;
          if (p.type === 'month') monthIdx = parseInt(p.value, 10) - 1;
          if (p.type === 'year') year = p.value;
        });

        const monthName = HIJRI_MONTHS[monthIdx] || "Hijri";
        hijriDateEl.textContent = `${day} ${monthName} ${year} AH`;
      } catch (e) {
        hijriDateEl.textContent = now.toLocaleDateString();
      }
    }

    function getLogs() {
      return JSON.parse(localStorage.getItem('tasbih_logs_v2') || '{}');
    }

    function getManualOffsets() {
      return JSON.parse(localStorage.getItem('tasbih_offsets') || '{}');
    }

    function saveTap(dhikrType) {
      const logs = getLogs();
      const dateKey = new Date().toISOString().split('T')[0];

      if (!logs[dateKey]) logs[dateKey] = {};
      if (!logs[dateKey][dhikrType]) logs[dateKey][dhikrType] = 0;

      logs[dateKey][dhikrType] += 1;
      localStorage.setItem('tasbih_logs_v2', JSON.stringify(logs));
    }

    function updateLifetimeTotals() {
      const logs = getLogs();
      const offsets = getManualOffsets();
      const totals = {};
      
      allDhikrList.forEach(item => totals[item] = offsets[item] || 0);

      Object.keys(logs).forEach(dateKey => {
        Object.keys(logs[dateKey]).forEach(dhikr => {
          if (totals[dhikr] !== undefined) {
            totals[dhikr] += logs[dateKey][dhikr];
          } else {
            totals[dhikr] = (offsets[dhikr] || 0) + logs[dateKey][dhikr];
          }
        });
      });

      lifetimeListEl.innerHTML = '';
      let grandTotal = 0;

      Object.keys(totals).forEach(item => {
        grandTotal += totals[item];
        const row = document.createElement('div');
        row.className = 'stat-row';
        row.innerHTML = `
          <span>${item} <button class="edit-icon-btn" title="Edit or Reset Total">✏️</button></span>
          <strong>${totals[item]}</strong>
        `;
        row.querySelector('.edit-icon-btn').addEventListener('click', () => editLifetimeTotal(item, totals[item]));
        lifetimeListEl.appendChild(row);
      });

      if (historyAllTimeTotal) {
        historyAllTimeTotal.textContent = grandTotal.toLocaleString();
      }
    }

    function editLifetimeTotal(dhikrName, currentTotal) {
      showCustomInputModal(`Edit Total for ${dhikrName}`, currentTotal, 'number', (val) => {
        const newTotal = parseInt(val, 10);
        if (isNaN(newTotal) || newTotal < 0) return;

        const logs = getLogs();
        let loggedSum = 0;
        
        Object.keys(logs).forEach(date => {
          if (logs[date][dhikrName]) {
            loggedSum += logs[date][dhikrName];
          }
        });

        const offsets = getManualOffsets();
        offsets[dhikrName] = newTotal - loggedSum;
        localStorage.setItem('tasbih_offsets', JSON.stringify(offsets));

        updateUI();
      });
    }

    function editCurrentCounter() {
      showCustomInputModal(`Edit Current Session Count`, count, 'number', (val) => {
        const parsed = parseInt(val, 10);
        if (!isNaN(parsed) && parsed >= 0) {
          count = parsed;
          updateUI();
        }
      });
    }

    function renderOffsetsList() {
      const offsets = getManualOffsets();
      offsetsModalList.innerHTML = '';
      
      const keys = Object.keys(offsets).filter(k => offsets[k] !== 0);
      if (keys.length === 0) {
        offsetsModalList.innerHTML = '<div style="font-size:0.85rem; color:var(--text-muted); padding:0.5rem 0;">No manual adjustments recorded.</div>';
        return;
      }

      keys.forEach(dhikr => {
        const row = document.createElement('div');
        row.className = 'stat-row';
        const val = offsets[dhikr];
        const sign = val > 0 ? '+' : '';
        row.innerHTML = `
          <span>${dhikr}</span>
          <strong style="color:${val >= 0 ? 'var(--accent-soft)' : '#ef4444'}">${sign}${val}</strong>
        `;
        offsetsModalList.appendChild(row);
      });
    }

    function updateHistoryView() {
      const logs = getLogs();
      const selectedDate = historyDatePicker.value;
      const selectedDhikr = historyDhikrSelect.value || currentDhikr;

      const hasActivityOnDate = logs[selectedDate] && Object.values(logs[selectedDate]).some(val => val > 0);
      if (hasActivityOnDate) {
        historyDatePicker.classList.add('has-data');
      } else {
        historyDatePicker.classList.remove('has-data');
      }

      if (logs[selectedDate]) {
        let dayTotal = 0;
        Object.values(logs[selectedDate]).forEach(val => dayTotal += val);

        const selectedCount = logs[selectedDate][selectedDhikr] || 0;
        historyCountSelected.textContent = selectedCount.toLocaleString();
        historyCountTotal.textContent = dayTotal.toLocaleString();
      } else {
        historyCountSelected.textContent = '0';
        historyCountTotal.textContent = '0';
      }
    }

    function resetTodayLogs() {
      const todayKey = new Date().toISOString().split('T')[0];
      showCustomConfirmModal(
        'Reset Today\'s Logs',
        `Are you sure you want to clear all recorded dhikrs for today (${todayKey})?`,
        () => {
          const logs = getLogs();
          if (logs[todayKey]) {
            delete logs[todayKey];
            localStorage.setItem('tasbih_logs_v2', JSON.stringify(logs));
          }
          count = 0;
          updateUI();
        }
      );
    }

    function performMasterReset() {
      showCustomConfirmModal(
        'Master Reset',
        'WARNING: This will permanently delete ALL recorded dhikr history, custom phrases, manual adjustments, and local settings. Are you completely sure?',
        () => {
          localStorage.clear();
          allDhikrList = DEFAULT_DHIKRS;
          currentDhikr = DEFAULT_DHIKRS[0];
          count = 0;
          target = 33;
          soundEnabled = true;
          vibeEnabled = true;
          visualHapticEnabled = true;
          alertTone = 'chime';
          alertVolume = 0.3;
          currentTheme = 'charcoal';

          renderDhikrOptions();
          applyTheme('charcoal');
          updateUI();
          settingsModal.style.display = 'none';
        }
      );
    }

    function toggleFocusMode(state) {
      focusMode = state;
      focusToggleSetting.checked = focusMode;
      if (focusMode) {
        document.body.classList.add('focus-mode');
      } else {
        document.body.classList.remove('focus-mode');
        unhideBtn.classList.remove('visible');
      }
    }

    function revealUnhideButton() {
      if (!focusMode) return;
      unhideBtn.classList.add('visible');
      clearTimeout(unhideTimeout);
      unhideTimeout = setTimeout(() => {
        unhideBtn.classList.remove('visible');
      }, 3000);
    }

    function handleTapAction() {
      initAudio();
      count++;
      saveTap(currentDhikr);

      triggerVibration(30);

      if (count % target === 0) {
        triggerVibration([100, 50, 100, 50, 150]);
        playGoalTone();
        triggerVisualPulse();
      }

      updateUI();
    }

    function promptCustomTarget() {
      showCustomInputModal('Set Custom Target Count', target, 'number', (val) => {
        const parsed = parseInt(val, 10);
        if (!isNaN(parsed) && parsed > 0) {
          target = parsed;
          updateUI();
        }
      });
    }

    function updateUI() {
      countEl.textContent = count;
      targetEl.textContent = target;
      targetBtn.textContent = `Target: ${target}`;

      updateLifetimeTotals();
      updateHistoryView();

      localStorage.setItem('tasbih_session_count', count);
      localStorage.setItem('tasbih_target', target);
      localStorage.setItem('tasbih_dhikr', currentDhikr);
    }

    // --- Data Export & Import ---
    document.getElementById('export-data-btn').addEventListener('click', () => {
      const exportObject = {
        logs: getLogs(),
        offsets: getManualOffsets(),
        allDhikrs: allDhikrList,
        version: 4
      };
      const blob = new Blob([JSON.stringify(exportObject, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `tasbih-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    });

    const importFileInput = document.getElementById('import-file-input');
    document.getElementById('import-data-btn').addEventListener('click', () => importFileInput.click());

    importFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (data.logs) localStorage.setItem('tasbih_logs_v2', JSON.stringify(data.logs));
          if (data.offsets) localStorage.setItem('tasbih_offsets', JSON.stringify(data.offsets));
          if (data.allDhikrs) {
            allDhikrList = data.allDhikrs;
            localStorage.setItem('tasbih_all_dhikrs', JSON.stringify(allDhikrList));
          }
          renderDhikrOptions();
          updateUI();
          alert('Backup restored successfully!');
        } catch (err) {
          alert('Invalid backup file format.');
        }
      };
      reader.readAsText(file);
    });

    // --- Adjustments Log Modal Controls ---
    openOffsetsBtn.addEventListener('click', () => {
      renderOffsetsList();
      offsetsModal.style.display = 'flex';
    });
    offsetsCloseBtn.addEventListener('click', () => offsetsModal.style.display = 'none');

    clearOffsetsBtn.addEventListener('click', () => {
      showCustomConfirmModal(
        'Reset Adjustments',
        'Are you sure you want to clear all manual adjustments? Your lifetime total will reflect pure logged counts only.',
        () => {
          localStorage.removeItem('tasbih_offsets');
          renderOffsetsList();
          updateUI();
        }
      );
    });

    // --- Main Event Listeners ---
    countEl.addEventListener('click', editCurrentCounter);

    document.addEventListener('pointerdown', (e) => {
      if (focusMode && !tapBtn.contains(e.target) && !unhideBtn.contains(e.target)) {
        revealUnhideButton();
      }
    });

    tapBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      e.preventDefault();
      handleTapAction();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && settingsModal.style.display !== 'flex' && inputModal.style.display !== 'flex' && confirmModal.style.display !== 'flex' && offsetsModal.style.display !== 'flex') {
        e.preventDefault();
        handleTapAction();
      }
    });

    presetSelect.addEventListener('change', (e) => {
      if (e.target.value === '__custom__') {
        showCustomInputModal('Add Custom Dhikr Phrase', '', 'text', (input) => {
          if (input && input.trim().length > 0) {
            const formatted = input.trim();
            if (!allDhikrList.includes(formatted)) {
              allDhikrList.push(formatted);
              localStorage.setItem('tasbih_all_dhikrs', JSON.stringify(allDhikrList));
            }
            currentDhikr = formatted;
          }
          renderDhikrOptions();
          updateUI();
        });
      } else {
        currentDhikr = e.target.value;
        count = 0;
        renderDhikrOptions();
        updateUI();
      }
    });

    resetBtn.addEventListener('click', () => {
      showCustomConfirmModal(
        'Reset Session',
        'Reset active session counter for this dhikr?',
        () => {
          count = 0;
          updateUI();
        }
      );
    });

    targetBtn.addEventListener('click', () => {
      if (target === 33) target = 100;
      else if (target === 100) target = 1000;
      else target = 33;
      updateUI();
    });

    targetInfoLabel.addEventListener('click', promptCustomTarget);

    settingsOpenBtn.addEventListener('click', () => settingsModal.style.display = 'flex');
    settingsCloseBtn.addEventListener('click', () => settingsModal.style.display = 'none');
    themeSelect.addEventListener('change', (e) => applyTheme(e.target.value));

    soundToggle.addEventListener('change', (e) => {
      soundEnabled = e.target.checked;
      localStorage.setItem('tasbih_sound', soundEnabled);
    });

    toneSelect.value = alertTone;
    toneSelect.addEventListener('change', (e) => {
      alertTone = e.target.value;
      localStorage.setItem('tasbih_alert_tone', alertTone);
      playGoalTone();
    });

    volumeRange.value = alertVolume;
    volumeRange.addEventListener('input', (e) => {
      alertVolume = parseFloat(e.target.value);
      localStorage.setItem('tasbih_volume', alertVolume);
    });

    visualHapticToggle.checked = visualHapticEnabled;
    visualHapticToggle.addEventListener('change', (e) => {
      visualHapticEnabled = e.target.checked;
      localStorage.setItem('tasbih_visual_pulse', visualHapticEnabled);
    });

    vibeToggle.addEventListener('change', (e) => {
      vibeEnabled = e.target.checked;
      localStorage.setItem('tasbih_vibe', vibeEnabled);
    });

    focusToggleBtn.addEventListener('click', () => toggleFocusMode(true));
    unhideBtn.addEventListener('click', () => toggleFocusMode(false));
    focusToggleSetting.addEventListener('change', (e) => toggleFocusMode(e.target.checked));

    resetTodayBtn.addEventListener('click', resetTodayLogs);
    masterResetBtn.addEventListener('click', performMasterReset);

    historyDatePicker.value = new Date().toISOString().split('T')[0];
    historyDatePicker.addEventListener('change', updateHistoryView);
    historyDhikrSelect.addEventListener('change', updateHistoryView);

    soundToggle.checked = soundEnabled;
    vibeToggle.checked = vibeEnabled;
    renderDhikrOptions();
    applyTheme(currentTheme);
    renderDates();
    updateUI();
  </script>
</body>
</html>
