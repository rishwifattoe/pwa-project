<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline Tasbih</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d9488">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #0d9488;
      --accent-hover: #14b8a6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 1.5rem;
      gap: 1rem;
    }
    header, main, section {
      width: 100%;
      max-width: 400px;
    }
    .date-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      padding: 0 0.25rem;
    }
    .date-bar strong {
      color: var(--accent-hover);
    }
    select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      border: 1px solid #334155;
      font-size: 1rem;
      outline: none;
    }
    .main-card {
      background: var(--card);
      border-radius: 24px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .counter-display {
      font-size: 4.5rem;
      font-weight: 800;
      color: var(--accent-hover);
      line-height: 1;
      margin: 0.5rem 0;
      font-variant-numeric: tabular-nums;
    }
    .target-info {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .tap-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, var(--accent-hover), var(--accent));
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(13, 148, 136, 0.4);
      transition: transform 0.05s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      margin: 1rem 0;
    }
    .tap-btn:active {
      transform: scale(0.95);
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }
    .control-btn {
      flex: 1;
      padding: 0.75rem;
      border-radius: 12px;
      border: 1px solid #334155;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .control-btn:active {
      background: #334155;
    }
    .stats-card {
      background: var(--card);
      border-radius: 16px;
      padding: 1.25rem;
      border: 1px solid #334155;
    }
    .stats-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 0.75rem;
      color: var(--accent-hover);
      display: flex;
      justify-content: space-between;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      font-size: 0.9rem;
      border-bottom: 1px solid #334155;
    }
    .stat-row:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="date-bar">
      <span id="gregorian-date">--</span>
      <span id="hijri-date"><strong>--</strong></span>
    </div>

    <select id="preset-select">
      <option value="Istighfar">Astaghfirullah (Istighfar)</option>
      <option value="SubhanAllah">SubhanAllah</option>
      <option value="Alhamdulillah">Alhamdulillah</option>
      <option value="Allahu Akbar">Allahu Akbar</option>
      <option value="La ilaha illallah">La ilaha illallah</option>
    </select>
  </header>

  <main class="main-card">
    <div class="target-info">Target: <span id="target-count">33</span></div>
    <div class="counter-display" id="count">0</div>
    <button class="tap-btn" id="tap-btn">TAP</button>
    <div class="controls">
      <button class="control-btn" id="reset-btn">Reset</button>
      <button class="control-btn" id="target-btn">Target: 33</button>
    </div>
  </main>

  <section class="stats-card">
    <div class="stats-title">
      <span>Today's Total</span>
      <span id="today-dhikr-name">Istighfar</span>
    </div>
    <div class="stat-row">
      <span>Today (Islamic Day):</span>
      <strong id="stat-today">0</strong>
    </div>
    <div class="stat-row">
      <span>This Islamic Week (Fri-Thu):</span>
      <strong id="stat-week">0</strong>
    </div>
  </section>

  <script>
    let currentDhikr = localStorage.getItem('tasbih_dhikr') || 'Istighfar';
    let count = parseInt(localStorage.getItem('tasbih_session_count') || '0');
    let target = parseInt(localStorage.getItem('tasbih_target') || '33');

    const presetSelect = document.getElementById('preset-select');
    const countEl = document.getElementById('count');
    const targetEl = document.getElementById('target-count');
    const tapBtn = document.getElementById('tap-btn');
    const resetBtn = document.getElementById('reset-btn');
    const targetBtn = document.getElementById('target-btn');
    const todayDhikrNameEl = document.getElementById('today-dhikr-name');
    const statTodayEl = document.getElementById('stat-today');
    const statWeekEl = document.getElementById('stat-week');
    const gregorianDateEl = document.getElementById('gregorian-date');
    const hijriDateEl = document.getElementById('hijri-date');

    presetSelect.value = currentDhikr;

    // Robust Hijri Date Formatter
    function getHijriString(date) {
      const locales = ['en-u-ca-islamic-nu-latn', 'en-US-u-ca-islamic', 'ar-SA'];
      for (let loc of locales) {
        try {
          const fmt = new Intl.DateTimeFormat(loc, { day: 'numeric', month: 'long', year: 'numeric' });
          const str = fmt.format(date);
          if (str && str !== 'Invalid Date') return str;
        } catch (e) {}
      }
      return null;
    }

    function renderDates() {
      const now = new Date();

      // Advance to next Islamic day after 6:00 PM (Maghrib)
      const islamicDate = new Date(now);
      if (now.getHours() >= 18) {
        islamicDate.setDate(islamicDate.getDate() + 1);
      }

      // Gregorian Format (Left)
      const gregOptions = { weekday: 'short', day: 'numeric', month: 'short' };
      gregorianDateEl.textContent = now.toLocaleDateString('en-GB', gregOptions);

      // Hijri Format (Right)
      const hijriStr = getHijriString(islamicDate);
      if (hijriStr) {
        hijriDateEl.innerHTML = `<strong>${hijriStr}</strong>`;
      } else {
        hijriDateEl.innerHTML = `<strong>Hijri Active</strong>`;
      }
    }

    function getIslamicDateKey(date = new Date()) {
      const d = new Date(date);
      if (d.getHours() >= 18) d.setDate(d.getDate() + 1);
      return d.toISOString().split('T')[0];
    }

    function getIslamicWeekKey(date = new Date()) {
      const d = new Date(date);
      if (d.getHours() >= 18) d.setDate(d.getDate() + 1);
      
      const day = d.getDay();
      const diffToFriday = (day >= 5) ? (day - 5) : (day + 2);
      
      const friday = new Date(d);
      friday.setDate(d.getDate() - diffToFriday);
      return `Week-of-${friday.toISOString().split('T')[0]}`;
    }

    function getLogs() {
      return JSON.parse(localStorage.getItem('tasbih_logs') || '{}');
    }

    function saveTap(dhikrType) {
      const logs = getLogs();
      const dayKey = getIslamicDateKey();
      const weekKey = getIslamicWeekKey();

      if (!logs[dhikrType]) logs[dhikrType] = { days: {}, weeks: {} };
      if (!logs[dhikrType].days[dayKey]) logs[dhikrType].days[dayKey] = 0;
      if (!logs[dhikrType].weeks[weekKey]) logs[dhikrType].weeks[weekKey] = 0;

      logs[dhikrType].days[dayKey] += 1;
      logs[dhikrType].weeks[weekKey] += 1;

      localStorage.setItem('tasbih_logs', JSON.stringify(logs));
    }

    function updateUI() {
      countEl.textContent = count;
      targetEl.textContent = target;
      targetBtn.textContent = `Target: ${target}`;
      todayDhikrNameEl.textContent = currentDhikr;

      const logs = getLogs();
      const dayKey = getIslamicDateKey();
      const weekKey = getIslamicWeekKey();

      const todayTotal = logs[currentDhikr]?.days[dayKey] || 0;
      const weekTotal = logs[currentDhikr]?.weeks[weekKey] || 0;

      statTodayEl.textContent = todayTotal;
      statWeekEl.textContent = weekTotal;

      localStorage.setItem('tasbih_session_count', count);
      localStorage.setItem('tasbih_target', target);
      localStorage.setItem('tasbih_dhikr', currentDhikr);
    }

    tapBtn.addEventListener('click', () => {
      count++;
      saveTap(currentDhikr);

      if ('vibrate' in navigator) navigator.vibrate(40);
      if (count % target === 0 && 'vibrate' in navigator) {
        navigator.vibrate([100, 50, 100]);
      }
      updateUI();
    });

    presetSelect.addEventListener('change', (e) => {
      currentDhikr = e.target.value;
      count = 0;
      updateUI();
    });

    resetBtn.addEventListener('click', () => {
      if (confirm('Reset session counter? (Daily & Weekly totals remain saved)')) {
        count = 0;
        updateUI();
      }
    });

    targetBtn.addEventListener('click', () => {
      if (target === 33) target = 100;
      else if (target === 100) target = 1000;
      else target = 33;
      updateUI();
    });

    renderDates();
    updateUI();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
