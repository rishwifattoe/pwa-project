<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Tasbih</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="title" content="Digital Tasbih">
    <meta name="description" content="Offline Digital Tasbih and Dhikr Counter PWA">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tasbih">
    
    <!-- Manifest & Icons -->
    <link rel="manifest" id="manifest-placeholder">
    <link rel="apple-touch-icon" id="apple-touch-icon">
    <link rel="icon" type="image/svg+xml" id="favicon">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        theme: {
                            50: 'var(--color-theme-50)',
                            100: 'var(--color-theme-100)',
                            200: 'var(--color-theme-200)',
                            300: 'var(--color-theme-300)',
                            400: 'var(--color-theme-400)',
                            500: 'var(--color-theme-500)',
                            600: 'var(--color-theme-600)',
                            700: 'var(--color-theme-700)',
                            800: 'var(--color-theme-800)',
                            900: 'var(--color-theme-900)',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* CSS Variables for Dynamic Color Themes */
        :root[data-theme="indigo"] {
            --color-theme-50: #eep2ff; --color-theme-100: #e0e7ff; --color-theme-200: #c7d2fe;
            --color-theme-300: #a5b4fc; --color-theme-400: #818cf8; --color-theme-500: #6366f1;
            --color-theme-600: #4f46e5; --color-theme-700: #4338ca; --color-theme-800: #3730a3;
            --color-theme-900: #312e81;
        }
        :root[data-theme="emerald"] {
            --color-theme-50: #ecfdf5; --color-theme-100: #d1fae5; --color-theme-200: #a7f3d0;
            --color-theme-300: #6ee7b7; --color-theme-400: #34d399; --color-theme-500: #10b981;
            --color-theme-600: #059669; --color-theme-700: #047857; --color-theme-800: #065f46;
            --color-theme-900: #064e3b;
        }
        :root[data-theme="sunset"] {
            --color-theme-50: #fff7ed; --color-theme-100: #ffedd5; --color-theme-200: #fed7aa;
            --color-theme-300: #fdba74; --color-theme-400: #fb923c; --color-theme-500: #f97316;
            --color-theme-600: #ea580c; --color-theme-700: #c2410c; --color-theme-800: #9a3412;
            --color-theme-900: #7c2d12;
        }
        :root[data-theme="crimson"] {
            --color-theme-50: #fff1f2; --color-theme-100: #ffe4e6; --color-theme-200: #fecdd3;
            --color-theme-300: #fda4af; --color-theme-400: #fb7185; --color-theme-500: #f43f5e;
            --color-theme-600: #e11d48; --color-theme-700: #be123c; --color-theme-800: #9f1239;
            --color-theme-900: #881337;
        }
        :root[data-theme="royal"] {
            --color-theme-50: #faf5ff; --color-theme-100: #f3e8ff; --color-theme-200: #e9d5ff;
            --color-theme-300: #d8b4fe; --color-theme-400: #c084fc; --color-theme-500: #a855f7;
            --color-theme-600: #9333ea; --color-theme-700: #7e22ce; --color-theme-800: #6b21a8;
            --color-theme-900: #581c87;
        }
        :root[data-theme="dark"] {
            --color-theme-50: #f8fafc; --color-theme-100: #f1f5f9; --color-theme-200: #e2e8f0;
            --color-theme-300: #cbd5e1; --color-theme-400: #94a3b8; --color-theme-500: #64748b;
            --color-theme-600: #475569; --color-theme-700: #334155; --color-theme-800: #1e293b;
            --color-theme-900: #0f172a;
        }

        * {
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none;
            user-select: none;
        }

        @keyframes ringPulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 15px var(--color-theme-500)); }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .pulse-active {
            animation: ringPulse 0.8s ease-in-out infinite;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-theme-400);
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .dark ::-webkit-scrollbar-thumb {
            background: var(--color-theme-600);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-300 select-none overflow-x-hidden">

    <!-- App Header -->
    <header class="w-full max-w-md mx-auto p-4 flex justify-between items-center z-10">
        <div class="flex items-center gap-2">
            <svg class="w-8 h-8 text-theme-600 dark:text-theme-400 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="9" r="6" stroke-dasharray="2 2" />
                <circle cx="12" cy="15" r="1.5" fill="currentColor" />
                <path d="M12 16.5 V21" />
                <path d="M10 21 L14 21" />
                <path d="M10.5 19.5 L13.5 19.5" />
            </svg>
            <h1 class="text-xl font-bold tracking-wide">Tasbih</h1>
        </div>
        <div class="flex items-center gap-2">
            <button id="btn-history" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                <i data-lucide="history" class="w-6 h-6"></i>
            </button>
            <button id="btn-settings" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                <i data-lucide="settings" class="w-6 h-6"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-md w-full mx-auto flex flex-col justify-between items-center px-4 pb-6">
        
        <!-- Top Stats / Target Indicator -->
        <div class="w-full flex justify-between items-center bg-white dark:bg-slate-800 px-4 py-3 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/50 mt-2">
            <div class="flex flex-col">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Target</span>
                <span id="display-target" class="text-lg font-bold text-theme-600 dark:text-theme-400 transition-colors">33</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Laps</span>
                <span id="display-laps" class="text-lg font-bold">0</span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total</span>
                <span id="display-total" class="text-lg font-bold text-slate-600 dark:text-slate-300">0</span>
            </div>
        </div>

        <!-- Counter Center Display & Clicker Zone -->
        <div class="my-auto py-8 flex flex-col items-center justify-center w-full">
            <div id="counter-ring-container" class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center rounded-full">
                <svg class="w-full h-full transform -rotate-90 overflow-visible" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="44" class="text-slate-200 dark:text-slate-700 stroke-current" stroke-width="8" fill="transparent"></circle>
                    <circle id="progress-bar" cx="50" cy="50" r="44" class="text-theme-600 dark:text-theme-500 stroke-current transition-all duration-150 ease-out" stroke-width="8" stroke-linecap="round" fill="transparent" stroke-dasharray="276.46" stroke-dashoffset="276.46"></circle>
                </svg>

                <button id="btn-count" class="absolute inset-4 rounded-full bg-white dark:bg-slate-800 shadow-xl border border-slate-100 dark:border-slate-700 flex flex-col items-center justify-center active:scale-95 transition-transform duration-100 focus:outline-none cursor-pointer">
                    <span id="display-count" class="text-6xl sm:text-7xl font-extrabold tracking-tight text-slate-900 dark:text-white">0</span>
                    <span id="dhikr-label" class="text-sm font-medium text-slate-400 mt-2 max-w-[140px] truncate text-center">SubhanAllah</span>
                </button>
            </div>
        </div>

        <!-- Controls Bottom Bar -->
        <div class="w-full grid grid-cols-3 gap-3">
            <button id="btn-reset" class="flex flex-col items-center justify-center py-3 px-4 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 active:scale-95 transition">
                <i data-lucide="rotate-ccw" class="w-5 h-5 text-slate-600 dark:text-slate-300 mb-1"></i>
                <span class="text-xs font-medium text-slate-500 dark:text-slate-400">Reset</span>
            </button>

            <button id="btn-sound" class="flex flex-col items-center justify-center py-3 px-4 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 active:scale-95 transition">
                <i id="icon-sound" data-lucide="volume-2" class="w-5 h-5 text-theme-600 dark:text-theme-400 mb-1 transition-colors"></i>
                <span id="label-sound" class="text-xs font-medium text-slate-500 dark:text-slate-400">Sound</span>
            </button>

            <button id="btn-dhikr-select" class="flex flex-col items-center justify-center py-3 px-4 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 active:scale-95 transition">
                <i data-lucide="book-open" class="w-5 h-5 text-slate-600 dark:text-slate-300 mb-1"></i>
                <span class="text-xs font-medium text-slate-500 dark:text-slate-400">Preset</span>
            </button>
        </div>
    </main>

    <!-- PRIVACY MODE OVERLAY (Full Pitch-Black Cover with Double-Tap Reveal) -->
    <div id="privacy-overlay" class="fixed inset-0 bg-black z-50 hidden flex-col justify-between p-6 touch-none">
        <div class="flex justify-end w-full">
            <button id="btn-exit-privacy" class="flex items-center gap-2 text-slate-400 hover:text-white bg-slate-900/90 border border-slate-800 px-4 py-2 rounded-full text-sm font-medium transition-opacity duration-300 opacity-0 pointer-events-none">
                <i data-lucide="eye-off" class="w-4 h-4"></i>
                <span>Exit Privacy Mode</span>
            </button>
        </div>
        <div id="privacy-tap-area" class="flex-1 w-full h-full cursor-pointer"></div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="modal-settings" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl border border-slate-100 dark:border-slate-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="settings" class="w-5 h-5 text-theme-600 dark:text-theme-400"></i>
                    Settings
                </h2>
                <button id="close-settings" class="p-1 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="space-y-6">
                <!-- Color Themes Palette -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Color Theme</label>
                    <div class="grid grid-cols-3 gap-2" id="theme-selector">
                        <button data-theme-id="indigo" class="theme-btn p-2 rounded-xl border flex items-center gap-2 text-xs font-semibold bg-indigo-50 border-indigo-200 text-indigo-700">
                            <span class="w-4 h-4 rounded-full bg-indigo-600"></span> Indigo
                        </button>
                        <button data-theme-id="emerald" class="theme-btn p-2 rounded-xl border flex items-center gap-2 text-xs font-semibold bg-emerald-50 border-emerald-200 text-emerald-700">
                            <span class="w-4 h-4 rounded-full bg-emerald-600"></span> Emerald
                        </button>
                        <button data-theme-id="sunset" class="theme-btn p-2 rounded-xl border flex items-center gap-2 text-xs font-semibold bg-orange-50 border-orange-200 text-orange-700">
                            <span class="w-4 h-4 rounded-full bg-orange-600"></span> Sunset
                        </button>
                        <button data-theme-id="crimson" class="theme-btn p-2 rounded-xl border flex items-center gap-2 text-xs font-semibold bg-rose-50 border-rose-200 text-rose-700">
                            <span class="w-4 h-4 rounded-full bg-rose-600"></span> Crimson
                        </button>
                        <button data-theme-id="royal" class="theme-btn p-2 rounded-xl border flex items-center gap-2 text-xs font-semibold bg-purple-50 border-purple-200 text-purple-700">
                            <span class="w-4 h-4 rounded-full bg-purple-600"></span> Royal
                        </button>
                        <button data-theme-id="dark" class="theme-btn p-2 rounded-xl border flex items-center gap-2 text-xs font-semibold bg-slate-100 border-slate-300 text-slate-800">
                            <span class="w-4 h-4 rounded-full bg-slate-800"></span> Dark
                        </button>
                    </div>
                </div>

                <!-- Target Setting -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Target Count</label>
                    <div class="grid grid-cols-4 gap-2 mb-2">
                        <button class="target-preset-btn py-2 bg-slate-100 dark:bg-slate-700 rounded-lg text-sm font-semibold hover:bg-theme-50 dark:hover:bg-theme-900/40 border border-transparent hover:border-theme-500 transition" data-target="33">33</button>
                        <button class="target-preset-btn py-2 bg-slate-100 dark:bg-slate-700 rounded-lg text-sm font-semibold hover:bg-theme-50 dark:hover:bg-theme-900/40 border border-transparent hover:border-theme-500 transition" data-target="99">99</button>
                        <button class="target-preset-btn py-2 bg-slate-100 dark:bg-slate-700 rounded-lg text-sm font-semibold hover:bg-theme-50 dark:hover:bg-theme-900/40 border border-transparent hover:border-theme-500 transition" data-target="100">100</button>
                        <button class="target-preset-btn py-2 bg-slate-100 dark:bg-slate-700 rounded-lg text-sm font-semibold hover:bg-theme-50 dark:hover:bg-theme-900/40 border border-transparent hover:border-theme-500 transition" data-target="1000">1000</button>
                    </div>
                    <input type="number" id="input-target" class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-theme-500 outline-none transition" placeholder="Custom Target">
                </div>

                <!-- Toggles -->
                <div class="space-y-4 pt-2 border-t border-slate-100 dark:border-slate-700">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="font-medium text-sm">Haptic Feedback</div>
                            <div class="text-xs text-slate-400">Vibrate on each tap</div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-vibrate" class="sr-only peer">
                            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:after:border-slate-600 peer-checked:bg-theme-600"></div>
                        </label>
                    </div>

                    <div class="flex justify-between items-center">
                        <div>
                            <div class="font-medium text-sm">Visual Ring Pulse Alert</div>
                            <div class="text-xs text-slate-400">Glow/Pulse ring when target reached</div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-pulse" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:after:border-slate-600 peer-checked:bg-theme-600"></div>
                        </label>
                    </div>

                    <div class="flex justify-between items-center">
                        <div>
                            <div class="font-medium text-sm">Dark Mode</div>
                            <div class="text-xs text-slate-400">Toggle dark interface style</div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-theme" class="sr-only peer">
                            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:after:border-slate-600 peer-checked:bg-theme-600"></div>
                        </label>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100 dark:border-slate-700">
                    <button id="btn-activate-privacy" class="w-full py-3 bg-slate-900 dark:bg-slate-700 text-white rounded-xl font-medium flex items-center justify-center gap-2 hover:bg-slate-800 dark:hover:bg-slate-600 transition">
                        <i data-lucide="eye-off" class="w-5 h-5"></i>
                        <span>Enter Privacy Mode</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- DHIKR PRESETS & MANAGEMENT MODAL -->
    <div id="modal-dhikr" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl border border-slate-100 dark:border-slate-700 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="book-open" class="w-5 h-5 text-theme-600 dark:text-theme-400"></i>
                    Select Dhikr
                </h2>
                <button id="close-dhikr" class="p-1 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            
            <div class="space-y-2 overflow-y-auto flex-1 pr-1" id="dhikr-list">
                <!-- Injected dynamically -->
            </div>

            <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700">
                <button id="btn-open-add-dhikr" class="w-full py-2.5 bg-theme-50 dark:bg-theme-900/30 text-theme-600 dark:text-theme-400 rounded-xl text-sm font-semibold hover:bg-theme-100 dark:hover:bg-theme-900/50 transition flex items-center justify-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add Custom Dhikr
                </button>
            </div>
        </div>
    </div>

    <!-- ADD / EDIT DHIKR MODAL -->
    <div id="modal-add-dhikr" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl w-full max-w-sm p-6 shadow-2xl border border-slate-100 dark:border-slate-700">
            <h3 id="dhikr-modal-title" class="text-lg font-bold mb-4">Add Custom Dhikr</h3>
            <input type="hidden" id="edit-dhikr-id" value="">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Title / Name</label>
                    <input type="text" id="add-dhikr-name" class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-theme-500 outline-none" placeholder="e.g. Astaghfirullah">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Arabic Text (Optional)</label>
                    <input type="text" id="add-dhikr-arabic" dir="rtl" class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-theme-500 outline-none font-serif" placeholder="أَسْتَغْفِرُ ٱللَّٰهَ">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Translation (Optional)</label>
                    <input type="text" id="add-dhikr-trans" class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-theme-500 outline-none" placeholder="I seek forgiveness from Allah">
                </div>
                <div class="flex gap-2 pt-2">
                    <button id="btn-save-dhikr" class="flex-1 py-2 bg-theme-600 text-white rounded-xl font-semibold hover:bg-theme-700 transition">Save</button>
                    <button id="btn-cancel-dhikr" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl font-semibold hover:bg-slate-200 dark:hover:bg-slate-600 transition">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HISTORY MODAL -->
    <div id="modal-history" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl border border-slate-100 dark:border-slate-700 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="history" class="w-5 h-5 text-theme-600 dark:text-theme-400"></i>
                    Dhikr History
                </h2>
                <button id="close-history" class="p-1 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div id="history-container" class="space-y-3 overflow-y-auto flex-1 pr-1">
                <!-- History logs loaded by JS -->
            </div>

            <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-700 flex justify-end">
                <button id="btn-clear-history" class="w-full py-2.5 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 rounded-xl text-sm font-semibold hover:bg-red-100 dark:hover:bg-red-900/40 transition">
                    Clear History
                </button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // PWA Manifest with Icon Padding & Safe-Zone Scaling Fix
        const manifestData = {
            name: "Digital Tasbih & Dhikr Counter",
            short_name: "Tasbih",
            description: "Offline Digital Tasbih PWA App",
            start_url: "./",
            display: "standalone",
            background_color: "#0f172a",
            theme_color: "#4f46e5",
            icons: [
                {
                    src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><g transform='translate(15, 15) scale(0.7)'><circle cx='50' cy='40' r='24' stroke='%23ffffff' stroke-width='6' fill='none' stroke-dasharray='8 8'/><circle cx='50' cy='64' r='5' fill='%23ffffff'/><path d='M50 69 L50 88 M43 88 L57 88 M45 82 L55 82' stroke='%23ffffff' stroke-width='5' stroke-linecap='round'/></g></svg>",
                    sizes: "512x512",
                    type: "image/svg+xml",
                    purpose: "any maskable"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
        document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));
        document.getElementById('favicon').setAttribute('href', manifestData.icons[0].src);
        document.getElementById('apple-touch-icon').setAttribute('href', manifestData.icons[0].src);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'tasbih-v4';
                    const ASSETS = ['./'];
                    self.addEventListener('install', (e) => {
                        e.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS)));
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            });
        }

        const DEFAULT_DHIKRS = [
            { id: '1', name: "SubhanAllah", arabic: "سُبْحَانَ ٱللَّٰهِ", translation: "Glory be to Allah" },
            { id: '2', name: "Alhamdulillah", arabic: "ٱلْحَمْدُ لِلَّٰهِ", translation: "Praise be to Allah" },
            { id: '3', name: "Allahu Akbar", arabic: "ٱللَّٰهُ أَكْبَرُ", translation: "Allah is the Greatest" },
            { id: '4', name: "La ilaha illallah", arabic: "لَا إِلَٰهَ إِلَّا ٱللَّٰهُ", translation: "There is no god but Allah" },
            { id: '5', name: "Astaghfirullah", arabic: "أَسْتَغْفِرُ ٱللَّٰهَ", translation: "I seek forgiveness from Allah" },
            { id: '6', name: "La hawla wa la quwwata illa billah", arabic: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِٱللَّٰهِ", translation: "There is no power except with Allah" },
            { id: '7', name: "SubhanAllahi wa bihamdihi", arabic: "سُبْحَانَ ٱللَّٰهِ وَبِحَمْدِهِ", translation: "Glory and praise be to Allah" },
            { id: '8', name: "Salawat", arabic: "اللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ", translation: "Blessings upon Muhammad" }
        ];

        class AudioFeedback {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playClick() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.04);
            }
            playCompletion() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    const startTime = this.ctx.currentTime + (index * 0.08);
                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.3);
                });
            }
        }

        const state = {
            count: 0,
            target: 33,
            laps: 0,
            total: 0,
            dhikrs: JSON.parse(localStorage.getItem('tasbih_dhikrs') || JSON.stringify(DEFAULT_DHIKRS)),
            dhikr: null,
            soundEnabled: true,
            vibrateEnabled: false,
            pulseEnabled: true,
            darkMode: false,
            theme: 'indigo',
            history: JSON.parse(localStorage.getItem('tasbih_history') || '[]')
        };

        state.dhikr = state.dhikrs[0];

        const audio = new AudioFeedback();

        const elDisplayCount = document.getElementById('display-count');
        const elDisplayTarget = document.getElementById('display-target');
        const elDisplayLaps = document.getElementById('display-laps');
        const elDisplayTotal = document.getElementById('display-total');
        const elDhikrLabel = document.getElementById('dhikr-label');
        const elProgressBar = document.getElementById('progress-bar');
        const elCounterRingContainer = document.getElementById('counter-ring-container');

        const btnCount = document.getElementById('btn-count');
        const btnReset = document.getElementById('btn-reset');
        const btnSound = document.getElementById('btn-sound');
        const iconSound = document.getElementById('icon-sound');
        const labelSound = document.getElementById('label-sound');
        const btnDhikrSelect = document.getElementById('btn-dhikr-select');
        const btnSettings = document.getElementById('btn-settings');
        const btnHistory = document.getElementById('btn-history');

        const modalSettings = document.getElementById('modal-settings');
        const closeSettings = document.getElementById('close-settings');
        const modalDhikr = document.getElementById('modal-dhikr');
        const closeDhikr = document.getElementById('close-dhikr');
        const modalHistory = document.getElementById('modal-history');
        const closeHistory = document.getElementById('close-history');

        const privacyOverlay = document.getElementById('privacy-overlay');
        const btnActivatePrivacy = document.getElementById('btn-activate-privacy');
        const btnExitPrivacy = document.getElementById('btn-exit-privacy');
        const privacyTapArea = document.getElementById('privacy-tap-area');

        const inputTarget = document.getElementById('input-target');
        const toggleVibrate = document.getElementById('toggle-vibrate');
        const togglePulse = document.getElementById('toggle-pulse');
        const toggleTheme = document.getElementById('toggle-theme');

        let privacyExitTimer = null;
        let lastTapTime = 0;

        function showPrivacyExitButton() {
            btnExitPrivacy.classList.remove('opacity-0', 'pointer-events-none');
            btnExitPrivacy.classList.add('opacity-100');
            clearTimeout(privacyExitTimer);
            privacyExitTimer = setTimeout(() => {
                btnExitPrivacy.classList.remove('opacity-100');
                btnExitPrivacy.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        function init() {
            lucide.createIcons();
            loadSettings();
            renderDhikrList();
            updateUI();
        }

        function applyTheme(themeId) {
            state.theme = themeId;
            document.documentElement.setAttribute('data-theme', themeId);
            document.querySelectorAll('.theme-btn').forEach(btn => {
                if (btn.getAttribute('data-theme-id') === themeId) {
                    btn.classList.add('ring-2', 'ring-slate-900', 'dark:ring-white');
                } else {
                    btn.classList.remove('ring-2', 'ring-slate-900', 'dark:ring-white');
                }
            });
            saveSettings();
        }

        function loadSettings() {
            const saved = localStorage.getItem('tasbih_settings');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.target = parsed.target || 33;
                state.soundEnabled = parsed.soundEnabled ?? true;
                state.vibrateEnabled = parsed.vibrateEnabled ?? false;
                state.pulseEnabled = parsed.pulseEnabled ?? true;
                state.darkMode = parsed.darkMode ?? false;
                state.theme = parsed.theme || 'indigo';
            }
            if (state.darkMode || window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
                toggleTheme.checked = true;
                state.darkMode = true;
            }
            applyTheme(state.theme);
            toggleVibrate.checked = state.vibrateEnabled;
            togglePulse.checked = state.pulseEnabled;
            inputTarget.value = state.target;
            updateSoundIcon();
        }

        function saveSettings() {
            localStorage.setItem('tasbih_settings', JSON.stringify({
                target: state.target,
                soundEnabled: state.soundEnabled,
                vibrateEnabled: state.vibrateEnabled,
                pulseEnabled: state.pulseEnabled,
                darkMode: state.darkMode,
                theme: state.theme
            }));
        }

        function updateUI() {
            elDisplayCount.textContent = state.count;
            elDisplayTarget.textContent = state.target;
            elDisplayLaps.textContent = state.laps;
            elDisplayTotal.textContent = state.total;
            elDhikrLabel.textContent = state.dhikr ? state.dhikr.name : 'Select Dhikr';

            const circumference = 2 * Math.PI * 44;
            const progress = Math.min(state.count / state.target, 1);
            const offset = circumference - (progress * circumference);
            elProgressBar.style.strokeDashoffset = offset;

            if (state.count >= state.target && state.pulseEnabled) {
                elCounterRingContainer.classList.add('pulse-active');
            } else {
                elCounterRingContainer.classList.remove('pulse-active');
            }
        }

        function increment() {
            state.count++;
            state.total++;

            if (state.soundEnabled) audio.playClick();
            if (state.vibrateEnabled && navigator.vibrate) navigator.vibrate(40);

            if (state.count >= state.target) {
                state.laps++;
                if (state.soundEnabled) audio.playCompletion();
                if (state.vibrateEnabled && navigator.vibrate) navigator.vibrate([60, 100, 60]);
                logHistory(state.dhikr ? state.dhikr.name : 'Dhikr', state.target);
            }

            updateUI();
        }

        function updateSoundIcon() {
            if (state.soundEnabled) {
                iconSound.setAttribute('data-lucide', 'volume-2');
                labelSound.textContent = 'Sound On';
            } else {
                iconSound.setAttribute('data-lucide', 'volume-x');
                labelSound.textContent = 'Mute';
            }
            lucide.createIcons();
        }

        btnCount.addEventListener('click', () => {
            if (state.count >= state.target) state.count = 0;
            increment();
        });

        // Stealth Privacy Tapping & Fullscreen Setup
        privacyTapArea.addEventListener('click', (e) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;
            
            // Double Tap or Top-Area Tap Reveals Exit Button
            if ((tapLength < 300 && tapLength > 0) || e.clientY < 80) {
                showPrivacyExitButton();
            } else {
                if (state.count >= state.target) state.count = 0;
                increment();
            }
            lastTapTime = currentTime;
        });

        btnActivatePrivacy.addEventListener('click', () => {
            modalSettings.classList.add('hidden');
            privacyOverlay.classList.remove('hidden');
            privacyOverlay.classList.add('flex');
            
            // Request Native Fullscreen to hide device battery/time bar
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }
        });

        btnExitPrivacy.addEventListener('click', (e) => {
            e.stopPropagation();
            clearTimeout(privacyExitTimer);
            privacyOverlay.classList.add('hidden');
            privacyOverlay.classList.remove('flex');

            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        });

        btnReset.addEventListener('click', () => {
            if (state.count > 0 && state.count < state.target) {
                logHistory((state.dhikr ? state.dhikr.name : 'Dhikr') + " (Partial)", state.count);
            }
            state.count = 0;
            state.laps = 0;
            updateUI();
        });

        btnSound.addEventListener('click', () => {
            state.soundEnabled = !state.soundEnabled;
            updateSoundIcon();
            saveSettings();
        });

        // Full Dhikr Management: Select, Add, Edit, and Delete Default/Custom Dhikrs
        function renderDhikrList() {
            const container = document.getElementById('dhikr-list');
            container.innerHTML = state.dhikrs.map((item) => `
                <div class="w-full text-left p-3 rounded-xl border border-slate-100 dark:border-slate-700 hover:bg-theme-50 dark:hover:bg-theme-900/30 transition flex justify-between items-center group ${state.dhikr && state.dhikr.id === item.id ? 'bg-theme-50/70 dark:bg-theme-900/40 border-theme-300 dark:border-theme-600' : ''}">
                    <button class="flex-1 text-left select-dhikr-btn" data-id="${item.id}">
                        <div class="font-bold text-slate-800 dark:text-slate-100">${item.name}</div>
                        <div class="text-xs text-slate-400">${item.translation || ''}</div>
                    </button>
                    <div class="flex items-center gap-2">
                        <div class="font-serif text-base text-theme-600 dark:text-theme-400 mr-1">${item.arabic || ''}</div>
                        <button class="edit-dhikr-btn p-1.5 text-slate-400 hover:text-theme-600 dark:hover:text-theme-400 rounded-lg transition" data-id="${item.id}">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        ${state.dhikrs.length > 1 ? `
                            <button class="delete-dhikr-btn p-1.5 text-slate-400 hover:text-red-500 rounded-lg transition" data-id="${item.id}">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            lucide.createIcons();

            container.querySelectorAll('.select-dhikr-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.getAttribute('data-id');
                    state.dhikr = state.dhikrs.find(d => d.id === id);
                    state.count = 0;
                    updateUI();
                    modalDhikr.classList.add('hidden');
                });
            });

            container.querySelectorAll('.edit-dhikr-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    const targetDhikr = state.dhikrs.find(d => d.id === id);
                    if (targetDhikr) {
                        document.getElementById('dhikr-modal-title').textContent = 'Edit Dhikr';
                        document.getElementById('edit-dhikr-id').value = targetDhikr.id;
                        document.getElementById('add-dhikr-name').value = targetDhikr.name;
                        document.getElementById('add-dhikr-arabic').value = targetDhikr.arabic || '';
                        document.getElementById('add-dhikr-trans').value = targetDhikr.translation || '';
                        modalAddDhikr.classList.remove('hidden');
                    }
                });
            });

            container.querySelectorAll('.delete-dhikr-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    state.dhikrs = state.dhikrs.filter(d => d.id !== id);
                    if (state.dhikr && state.dhikr.id === id) state.dhikr = state.dhikrs[0];
                    localStorage.setItem('tasbih_dhikrs', JSON.stringify(state.dhikrs));
                    renderDhikrList();
                    updateUI();
                });
            });
        }

        const modalAddDhikr = document.getElementById('modal-add-dhikr');
        document.getElementById('btn-open-add-dhikr').addEventListener('click', () => {
            document.getElementById('dhikr-modal-title').textContent = 'Add Custom Dhikr';
            document.getElementById('edit-dhikr-id').value = '';
            document.getElementById('add-dhikr-name').value = '';
            document.getElementById('add-dhikr-arabic').value = '';
            document.getElementById('add-dhikr-trans').value = '';
            modalAddDhikr.classList.remove('hidden');
        });

        document.getElementById('btn-cancel-dhikr').addEventListener('click', () => {
            modalAddDhikr.classList.add('hidden');
        });

        document.getElementById('btn-save-dhikr').addEventListener('click', () => {
            const editId = document.getElementById('edit-dhikr-id').value;
            const name = document.getElementById('add-dhikr-name').value.trim();
            const arabic = document.getElementById('add-dhikr-arabic').value.trim();
            const translation = document.getElementById('add-dhikr-trans').value.trim();

            if (name) {
                if (editId) {
                    const idx = state.dhikrs.findIndex(d => d.id === editId);
                    if (idx !== -1) {
                        state.dhikrs[idx] = { ...state.dhikrs[idx], name, arabic, translation };
                        if (state.dhikr && state.dhikr.id === editId) {
                            state.dhikr = state.dhikrs[idx];
                        }
                    }
                } else {
                    const newDhikr = {
                        id: Date.now().toString(),
                        name: name,
                        arabic: arabic,
                        translation: translation
                    };
                    state.dhikrs.push(newDhikr);
                    state.dhikr = newDhikr;
                    state.count = 0;
                }
                localStorage.setItem('tasbih_dhikrs', JSON.stringify(state.dhikrs));
                renderDhikrList();
                updateUI();
                modalAddDhikr.classList.add('hidden');
            }
        });

        function logHistory(name, count) {
            if (count <= 0) return;
            const entry = {
                id: Date.now(),
                name: name,
                count: count,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                date: new Date().toLocaleDateString()
            };
            state.history.unshift(entry);
            localStorage.setItem('tasbih_history', JSON.stringify(state.history));
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            if (state.history.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">No completed dhikr logs yet.</div>`;
                return;
            }
            container.innerHTML = state.history.map(item => `
                <div class="flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-900/60 rounded-xl border border-slate-100 dark:border-slate-700/50">
                    <div>
                        <div class="font-semibold text-sm text-slate-800 dark:text-slate-200">${item.name}</div>
                        <div class="text-xs text-slate-400">${item.date} • ${item.timestamp}</div>
                    </div>
                    <div class="font-bold text-theme-600 dark:text-theme-400 text-lg transition-colors">
                        +${item.count}
                    </div>
                </div>
            `).join('');
        }

        btnSettings.addEventListener('click', () => modalSettings.classList.remove('hidden'));
        closeSettings.addEventListener('click', () => modalSettings.classList.add('hidden'));

        btnDhikrSelect.addEventListener('click', () => {
            renderDhikrList();
            modalDhikr.classList.remove('hidden');
        });
        closeDhikr.addEventListener('click', () => modalDhikr.classList.add('hidden'));

        btnHistory.addEventListener('click', () => {
            renderHistory();
            modalHistory.classList.remove('hidden');
        });
        closeHistory.addEventListener('click', () => modalHistory.classList.add('hidden'));

        document.getElementById('btn-clear-history').addEventListener('click', () => {
            state.history = [];
            localStorage.removeItem('tasbih_history');
            renderHistory();
        });

        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const themeId = btn.getAttribute('data-theme-id');
                applyTheme(themeId);
            });
        });

        document.querySelectorAll('.target-preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const target = parseInt(btn.getAttribute('data-target'));
                state.target = target;
                inputTarget.value = target;
                saveSettings();
                updateUI();
            });
        });

        inputTarget.addEventListener('change', (e) => {
            const val = parseInt(e.target.value);
            if (val > 0) {
                state.target = val;
                saveSettings();
                updateUI();
            }
        });

        toggleVibrate.addEventListener('change', (e) => {
            state.vibrateEnabled = e.target.checked;
            saveSettings();
        });

        togglePulse.addEventListener('change', (e) => {
            state.pulseEnabled = e.target.checked;
            saveSettings();
            updateUI();
        });

        toggleTheme.addEventListener('change', (e) => {
            state.darkMode = e.target.checked;
            if (state.darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            saveSettings();
        });

        init();
    </script>
</body>
</html>
