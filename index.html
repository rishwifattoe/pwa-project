<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>An-Noor Digital Tasbih</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --gold: #fbbf24;
      --gold-glow: rgba(251, 191, 36, 0.3);
      --success: #10b981;
      --danger: #ef4444;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    /* Prevent text highlight and blue touch highlights globally */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 20px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-svg {
      width: 42px;
      height: 48px;
      filter: drop-shadow(0 2px 8px var(--accent-glow));
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
      justify-content: center;
    }

    .phrase-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .arabic-text {
      font-family: 'Amiri', serif;
      font-size: 2.2rem;
      color: var(--gold);
      margin-bottom: 8px;
      line-height: 1.4;
      text-shadow: 0 0 12px var(--gold-glow);
    }

    .transliteration {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .translation {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .counter-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }

    .counter-ring-btn {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30,41,59,0.9) 0%, rgba(15,23,42,0.95) 100%);
      border: 4px solid var(--accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 0 30px var(--accent-glow), inset 0 0 20px rgba(0, 0, 0, 0.5);
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.1s ease;
    }

    .counter-ring-btn:active {
      transform: scale(0.96);
    }

    /* Ring alert fix: explicitly curved radial shadow to prevent rectangular box overlay */
    .counter-ring-btn.pulse-alert {
      animation: ringPulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes ringPulse {
      0% {
        box-shadow: 0 0 20px var(--gold-glow), inset 0 0 15px rgba(251, 191, 36, 0.2);
        border-color: var(--gold);
      }
      100% {
        box-shadow: 0 0 50px var(--gold), inset 0 0 35px rgba(251, 191, 36, 0.5);
        border-color: #ffffff;
      }
    }

    .counter-value {
      font-size: 4.5rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
      background: linear-gradient(to bottom, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .target-label {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 14px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .stat-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .controls-grid {
      display: flex;
      gap: 12px;
    }

    .action-btn {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 14px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .drawer {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      background: #0f172a;
      border-top: 1px solid var(--card-border);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 24px 20px 40px 20px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
      transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      max-height: 85vh;
      overflow-y: auto;
    }

    .drawer.active {
      bottom: 0;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .drawer-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .toggle-switch {
      position: relative;
      width: 50px;
      height: 26px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 90;
      backdrop-filter: blur(4px);
    }

    .backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Dedicated Privacy Mode Overlay */
    #privacyModeOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 99999;
      display: none;
      cursor: pointer;
    }

    #privacyModeOverlay.active {
      display: block;
    }

    .privacy-exit-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.75rem;
      padding: 8px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <!-- Feature 1: Updated Logo SVG with Tassel hanging underneath the beads ring -->
      <svg class="logo-svg" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Main Circular Bead Strand -->
        <circle cx="50" cy="45" r="35" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
        <!-- Main Accent Beads -->
        <circle cx="50" cy="10" r="5" fill="#fbbf24"/>
        <circle cx="85" cy="45" r="4.5" fill="#fbbf24"/>
        <circle cx="15" cy="45" r="4.5" fill="#fbbf24"/>
        <circle cx="50" cy="80" r="6" fill="#6366f1"/>
        <!-- Bottom Hanging Tassel assembly -->
        <path d="M50 86 L50 96" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
        <circle cx="50" cy="97" r="3" fill="#fbbf24"/>
        <path d="M43 102 C43 102 46 118 40 120 M50 102 L50 120 M57 102 C57 102 54 118 60 120" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
        <defs>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="100" y2="100">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#6366f1"/>
          </linearGradient>
        </defs>
      </svg>
      <div>
        <div class="brand-title">An-Noor Tasbih</div>
        <div class="brand-subtitle">Digital Dhikr Companion</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleSettingsDrawer()" title="Settings">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <main class="app-container">
    <div class="phrase-card">
      <div class="arabic-text" id="arabicText">سُبْحَانَ ٱللَّٰهِ</div>
      <div class="transliteration" id="transliterationText">SubhanAllah</div>
      <div class="translation" id="translationText">Glory be to Allah</div>
    </div>

    <div class="counter-wrapper">
      <button class="counter-ring-btn" id="counterBtn" onclick="incrementCounter()">
        <div class="counter-value" id="counterDisplay">0</div>
        <div class="target-label" id="targetDisplay">Target: 33</div>
      </button>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-title">Daily Cumulative</div>
        <div class="stat-val" id="dailyTotalDisplay">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Total Sessions</div>
        <div class="stat-val" id="totalSessionsDisplay">0</div>
      </div>
    </div>

    <div class="controls-grid">
      <button class="action-btn" onclick="resetCurrentCounter()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Reset
      </button>
      <button class="action-btn" onclick="cycleDhikr()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
        Switch Dhikr
      </button>
    </div>
  </main>

  <div class="backdrop" id="backdrop" onclick="toggleSettingsDrawer()"></div>

  <div class="drawer" id="settingsDrawer">
    <div class="drawer-header">
      <div class="drawer-title">Preferences</div>
      <button class="icon-btn" onclick="toggleSettingsDrawer()">&times;</button>
    </div>

    <div class="setting-item">
      <div>
        <div style="font-weight:600;">Haptic Feedback</div>
        <div style="font-size:0.75rem; color:var(--text-muted);">Vibrate device on tap</div>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="hapticToggle" checked onchange="toggleSetting('haptic', this.checked)">
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-item">
      <div>
        <div style="font-weight:600;">Visual Ring Pulse Alert</div>
        <div style="font-size:0.75rem; color:var(--text-muted);">Glow counter when goal is met</div>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="pulseToggle" checked onchange="toggleSetting('pulse', this.checked)">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Feature 4: Privacy Mode Option in Settings -->
    <div class="setting-item">
      <div>
        <div style="font-weight:600;">Privacy Mode</div>
        <div style="font-size:0.75rem; color:var(--text-muted);">Blackout screen; tap anywhere to count</div>
      </div>
      <button class="action-btn" style="flex:0; padding: 8px 16px; font-size: 0.8rem;" onclick="enablePrivacyMode()">
        Enable
      </button>
    </div>
  </div>

  <!-- Feature 4: Fullscreen Privacy Overlay -->
  <div id="privacyModeOverlay" onclick="handlePrivacyTap(event)">
    <button class="privacy-exit-btn" onclick="disablePrivacyMode(event)">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13.875 18.825A10.05 10.05 0 0112 19c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      Exit Privacy Mode
    </button>
  </div>

  <script>
    const dhikrList = [
      { arabic: "سُبْحَانَ ٱللَّٰهِ", transliteration: "SubhanAllah", translation: "Glory be to Allah", target: 33 },
      { arabic: "ٱلْحَمْدُ لِلَّٰهِ", transliteration: "Alhamdulillah", translation: "Praise be to Allah", target: 33 },
      { arabic: "ٱللَّٰهُ أَكْبَرُ", transliteration: "Allahu Akbar", translation: "Allah is the Greatest", target: 34 },
      { arabic: "لَا إِلَٰهَ إِلَّا ٱللَّٰهُ", transliteration: "La ilaha illallah", translation: "There is no god but Allah", target: 100 }
    ];

    let currentDhikrIdx = 0;
    let count = 0;
    let dailyCumulative = 0;
    let completedSessions = 0;

    let settings = {
      haptic: true,
      pulse: true
    };

    function init() {
      const savedCount = localStorage.getItem('noor_count');
      const savedDaily = localStorage.getItem('noor_daily');
      const savedSessions = localStorage.getItem('noor_sessions');
      const savedSettings = localStorage.getItem('noor_settings');

      if (savedCount !== null) count = parseInt(savedCount, 10);
      if (savedDaily !== null) dailyCumulative = parseInt(savedDaily, 10);
      if (savedSessions !== null) completedSessions = parseInt(savedSessions, 10);
      if (savedSettings !== null) settings = JSON.parse(savedSettings);

      document.getElementById('hapticToggle').checked = settings.haptic;
      document.getElementById('pulseToggle').checked = settings.pulse;

      updateUI();
    }

    function updateUI() {
      const current = dhikrList[currentDhikrIdx];
      document.getElementById('arabicText').innerText = current.arabic;
      document.getElementById('transliterationText').innerText = current.transliteration;
      document.getElementById('translationText').innerText = current.translation;
      document.getElementById('targetDisplay').innerText = `Target: ${current.target}`;
      document.getElementById('counterDisplay').innerText = count;
      document.getElementById('dailyTotalDisplay').innerText = dailyCumulative;
      document.getElementById('totalSessionsDisplay').innerText = completedSessions;

      const ringBtn = document.getElementById('counterBtn');
      if (settings.pulse && count >= current.target) {
        ringBtn.classList.add('pulse-alert');
      } else {
        ringBtn.classList.remove('pulse-alert');
      }
    }

    function incrementCounter() {
      count++;
      dailyCumulative++;
      
      const target = dhikrList[currentDhikrIdx].target;
      if (count === target) {
        completedSessions++;
      }

      if (settings.haptic && navigator.vibrate) {
        navigator.vibrate(40);
      }

      saveState();
      updateUI();
    }

    function resetCurrentCounter() {
      count = 0;
      saveState();
      updateUI();
    }

    function cycleDhikr() {
      currentDhikrIdx = (currentDhikrIdx + 1) % dhikrList.length;
      count = 0;
      saveState();
      updateUI();
    }

    function saveState() {
      localStorage.setItem('noor_count', count);
      localStorage.setItem('noor_daily', dailyCumulative);
      localStorage.setItem('noor_sessions', completedSessions);
    }

    function toggleSetting(key, value) {
      settings[key] = value;
      localStorage.setItem('noor_settings', JSON.stringify(settings));
      updateUI();
    }

    function toggleSettingsDrawer() {
      document.getElementById('settingsDrawer').classList.toggle('active');
      document.getElementById('backdrop').classList.toggle('active');
    }

    /* Privacy Mode Handlers */
    function enablePrivacyMode() {
      toggleSettingsDrawer();
      document.getElementById('privacyModeOverlay').classList.add('active');
    }

    function disablePrivacyMode(e) {
      e.stopPropagation();
      document.getElementById('privacyModeOverlay').classList.remove('active');
    }

    function handlePrivacyTap(e) {
      incrementCounter();
    }

    window.onload = init;
  </script>
</body>
</html>
